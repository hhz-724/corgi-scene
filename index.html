<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>炸炸炸鸡 &amp; hhz · 我们的小房间</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#f7e3d0;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
canvas#gl{display:block;width:100%;height:100%;touch-action:none}

.lbl{position:fixed;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);
  font-size:13px;font-weight:600;letter-spacing:.2px;white-space:nowrap;
  padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.96);color:#5b4034;
  box-shadow:0 4px 14px rgba(120,80,50,.18),0 0 0 1px rgba(255,255,255,.9) inset;
  opacity:0;transition:opacity .3s;backdrop-filter:blur(6px)}
.lbl.on{opacity:1}
.lbl b{font-weight:800}
.lbl.dog{color:#b3562a}
.lbl.man{color:#3d7d5c}

#bub{position:fixed;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%) scale(.86);
  font-size:14px;font-weight:600;line-height:1.4;white-space:nowrap;
  padding:10px 15px;border-radius:16px;background:#fff;color:#5b4034;
  box-shadow:0 8px 24px rgba(120,80,50,.22);opacity:0;
  transition:opacity .2s,transform .2s;z-index:4}
#bub.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
#bub:after{content:'';position:absolute;left:50%;bottom:-6px;width:12px;height:12px;
  background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}

#top{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));z-index:5;
  text-align:center;pointer-events:none}
#top h1{font-size:17px;font-weight:800;letter-spacing:.2px;color:#6b4630;
  text-shadow:0 2px 10px rgba(255,255,255,.8)}
#top p{font-size:11.5px;color:#8d6a54;margin-top:4px;letter-spacing:.3px;
  text-shadow:0 1px 8px rgba(255,255,255,.9)}

#hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;
  padding:12px 12px calc(16px + env(safe-area-inset-bottom));z-index:6;flex-wrap:wrap}
#hud button{font-family:inherit;font-size:13.5px;font-weight:700;color:#7a4e32;cursor:pointer;
  background:rgba(255,255,255,.94);border:0;border-radius:999px;padding:11px 17px;
  box-shadow:0 5px 16px rgba(120,80,50,.16),0 0 0 1px rgba(255,255,255,.9) inset;
  transition:transform .13s,background .2s;backdrop-filter:blur(8px)}
#hud button:active{transform:scale(.95)}
#hud button.on{background:#ffd9a8;color:#8a5124}

#hint{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));
  text-align:center;font-size:11.5px;color:rgba(120,85,60,.55);z-index:4;
  pointer-events:none;transition:opacity .5s;letter-spacing:.2px}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f7e3d0;z-index:20;
  color:#a07d64;font-size:13px;font-weight:600;transition:opacity .5s;letter-spacing:.5px}
#boot.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="top"><h1>炸炸炸鸡 &amp; hhz</h1><p>我们的小房间 · 拖一下看看别处</p></div>
<div id="hint">点点炸炸炸鸡或 hhz · 也可以抱抱</div>
<div id="hud">
  <button id="bHug">抱抱</button>
  <button id="bPet">摸摸炸炸</button>
  <button id="bLight">换个光</button>
  <button id="bSpin">环绕</button>
</div>
<div id="boot">正在布置小房间…</div>

<script type="importmap">
{"imports":{"three":"./three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ================= 渲染 ================= */
const gl = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas:gl, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6e2ce);
scene.fog = new THREE.Fog(0xf6e2ce, 13, 30);

const camera = new THREE.PerspectiveCamera(36, 1, .1, 90);

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

/* ================= 调色 ================= */
const C = {
  fur:0xf7ab63, furD:0xe8913f, furL:0xffc98a, cream:0xfff8ef,
  pink:0xffb8c4, pinkD:0xff8fa3, nose:0x4a3028, eye:0x3d2a24,
  skin:0xf9d6bb, hair:0x54382a, mint:0xa8d8bb, mintD:0x87bfa0,
  wood:0xe8c39a, woodD:0xd2a878, rug:0xffe8d6, rug2:0xffc9ad,
  leaf:0x86b87c, leafD:0x6b9c63, pot:0xdb8f6d,
  metal:0xd6bfa6, wall:0xffe6d0, floor:0xe9c49c,
  red:0xe2605c, yellow:0xf2c96b, blue:0x9dc0dd, purple:0xbda6d6
};

const mat = (color, opt) => new THREE.MeshStandardMaterial(Object.assign({
  color, roughness:.82, metalness:0
}, opt || {}));

function sph(r, color, sx=1, sy=1, sz=1, seg=32, opt){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.round(seg*0.75)), mat(color, opt));
  m.scale.set(sx, sy, sz);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function box(w,h,d,color,opt){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color, opt));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt,rb,h,color,seg=24,opt){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color,opt));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/* 圆润的耳朵：旋转体，顶端收圆 */
function earGeo(h=0.34, r=0.135){
  const pts = [];
  const N = 14;
  for (let i=0;i<=N;i++){
    const t = i/N;
    const y = t*h;
    const k = Math.pow(1-t, .72);
    const rad = Math.max(0.004, r*k*(1 + 0.18*Math.sin(t*Math.PI)));
    pts.push(new THREE.Vector2(rad, y));
  }
  return new THREE.LatheGeometry(pts, 24);
}

/* ================= 灯光（柔和棚拍感） ================= */
scene.add(new THREE.HemisphereLight(0xfff2e2, 0xd9b79a, 1.15));
const ambient = new THREE.AmbientLight(0xfff0e0, .35);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffe8cf, 2.5);
key.position.set(3.6, 6.6, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7; key.shadow.camera.right = 7;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1; key.shadow.camera.far = 26;
key.shadow.bias = -0.0009;
key.shadow.radius = 3;
scene.add(key);

const rim = new THREE.DirectionalLight(0xbfd4ff, .85);
rim.position.set(-4.5, 3.8, -4.0);
scene.add(rim);

const warmFill = new THREE.PointLight(0xffb877, 9, 14, 2);
warmFill.position.set(2.3, 2.15, -0.3);
scene.add(warmFill);

const faceFill = new THREE.PointLight(0xfff2e0, 4.5, 9, 2);
faceFill.position.set(0.6, 1.6, 3.2);
scene.add(faceFill);

/* ================= 房间 ================= */
const floor = new THREE.Mesh(new THREE.CircleGeometry(20, 64), mat(C.floor, {roughness:.95}));
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const rug = new THREE.Mesh(new THREE.CircleGeometry(2.9, 64), mat(C.rug, {roughness:1}));
rug.rotation.x = -Math.PI/2; rug.position.y = .01; rug.receiveShadow = true;
scene.add(rug);
const rug2 = new THREE.Mesh(new THREE.RingGeometry(2.06, 2.24, 64), mat(C.rug2, {roughness:1}));
rug2.rotation.x = -Math.PI/2; rug2.position.y = .014;
scene.add(rug2);

/* 墙：柔和渐变 */
const wallTex = (()=>{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#ffe9d5'); g.addColorStop(.5,'#ffdfc4'); g.addColorStop(1,'#f6cba8');
  x.fillStyle = g; x.fillRect(0,0,4,256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 13), new THREE.MeshStandardMaterial({map:wallTex, roughness:1}));
wall.position.set(0, 6.5, -5.2);
wall.receiveShadow = true;
scene.add(wall);

const skirt = box(30,.3,.18,C.woodD);
skirt.position.set(0,.15,-5.06); scene.add(skirt);

/* 窗 */
const skyTex = (()=>{
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,128);
  g.addColorStop(0,'#8fc4ef'); g.addColorStop(.62,'#cfe4f6'); g.addColorStop(1,'#ffd6c0');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  x.fillStyle = 'rgba(255,255,255,.9)';
  [[30,34,26],[52,30,18],[84,42,22],[100,38,14]].forEach(([a,b,r])=>{
    x.beginPath(); x.arc(a,b,r,0,7); x.fill();
  });
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const winW = 2.9, winH = 2.5;
const glass = new THREE.Mesh(new THREE.PlaneGeometry(winW, winH), new THREE.MeshBasicMaterial({map:skyTex}));
glass.position.set(-2.8, 3.5, -5.14);
scene.add(glass);
/* 窗框 */
const frameMat = mat(0xfaf0e2, {roughness:.7});
for (const [w,h,x,y] of [[winW+.34,.18,0,winH/2+.08],[winW+.34,.18,0,-winH/2-.08]]){
  const b = box(w,h,.14,0xfaf0e2); b.position.set(-2.8+x, 3.5+y, -5.06); scene.add(b);
}
for (const s of [-1,1]){
  const b = box(.18,winH+.34,.14,0xfaf0e2); b.position.set(-2.8+s*(winW/2+.08), 3.5, -5.06); scene.add(b);
}
const crossV = box(.09,winH,.1,0xfaf0e2); crossV.position.set(-2.8,3.5,-5.07); scene.add(crossV);
const crossH = box(winW,.09,.1,0xfaf0e2); crossH.position.set(-2.8,3.5,-5.07); scene.add(crossH);

const sill = box(winW+.6,.16,.4,0xf3e4d0); sill.position.set(-2.8,2.2,-5.0); scene.add(sill);
/* 窗台小植物 */
for (let i=0;i<3;i++){
  const p = cyl(.1,.075,.2,C.pot,16); p.position.set(-3.62+i*.34,2.38,-4.94); scene.add(p);
  const l = sph(.12, i%2?C.leaf:C.leafD, 1,1.3,.9, 16);
  l.position.set(-3.62+i*.34,2.56,-4.94); scene.add(l);
}
/* 窗帘 */
for (const s of [-1,1]){
  const cur = box(.5,3.0,.16,0xffd9bd); cur.position.set(-2.8+s*1.86,3.3,-4.98);
  cur.rotation.z = s*.025; scene.add(cur);
  const cur2 = box(.24,3.0,.2,0xffc6a4); cur2.position.set(-2.8+s*1.62,3.3,-4.96);
  scene.add(cur2);
}
const rod = box(winW+3.9,.1,.1,C.woodD); rod.position.set(-2.8,4.86,-4.96); scene.add(rod);
for (const s of [-1,1]){
  const kn = sph(.11,C.wood,1,1,1,16); kn.position.set(-2.8+s*(winW/2+1.9),4.86,-4.96); scene.add(kn);
}

/* 墙面装饰：相框 */
function picFrame(x,y,size,color,inner){
  const f = box(size+.16,size+.16,.08,0xfaf0e2); f.position.set(x,y,-5.1); scene.add(f);
  const p = box(size,size,.05,color); p.position.set(x,y,-5.04); scene.add(p);
  if (inner){
    const l = sph(.05,inner,1,1,.5,12); l.position.set(x,y+.02,-5.0); scene.add(l);
  }
}
picFrame(-.9,3.3,.8,0xf7c9a8,0xff8f7a);
picFrame(.42,3.55,.58,0xcfe4f6,0xf7ab63);
picFrame(-.16,2.42,.52,0xffd9e2,0xff8fa3);

/* 串灯 */
const wirePts = [];
for (let i=0;i<=40;i++){
  const t = i/40;
  wirePts.push(-3.9 + t*7.8, 3.0 - Math.sin(t*Math.PI)*.66, -5.02);
}
const wg = new THREE.BufferGeometry();
wg.setAttribute('position', new THREE.Float32BufferAttribute(wirePts,3));
scene.add(new THREE.Line(wg, new THREE.LineBasicMaterial({color:0xd0aa86})));
const bulbs = [];
for (let i=0;i<=12;i++){
  const t = i/12;
  const b = sph(.062, 0xffd9a0, 1,1,1, 14, {emissive:0xffb766, emissiveIntensity:1.4});
  b.castShadow = false;
  b.userData = {warm: i%3 !== 0};
  b.position.set(-3.9+t*7.8, 3.0 - Math.sin(t*Math.PI)*.66 - .06, -5.02);
  scene.add(b); bulbs.push(b);
}

/* 落地灯 */
const lampG = new THREE.Group();
lampG.position.set(2.62,0,-.42);
lampG.add(cyl(.055,.075,2.0,C.metal,20));
lampG.children[0].position.y = 1.0;
const lbase = cyl(.42,.5,.12,C.metal,24); lbase.position.y = .06; lampG.add(lbase);
const lshade = new THREE.Mesh(new THREE.CylinderGeometry(.38,.56,.5,28,1,true), mat(0xffe3bd,{roughness:.9, side:THREE.DoubleSide}));
lshade.position.y = 2.14; lampG.add(lshade);
const lbulb = sph(.15,0xfff3d8,1,1,1,16,{emissive:0xffcf94, emissiveIntensity:2.2});
lbulb.position.y = 1.96; lbulb.castShadow = false; lampG.add(lbulb);
scene.add(lampG);

/* 书架 */
const shelfG = new THREE.Group();
shelfG.position.set(2.0,0,-3.2);
const shelfBack = box(1.5,1.8,.08,C.woodD); shelfBack.position.set(0,.9,-.22); shelfG.add(shelfBack);
for (const x of [-.73,.73]){
  const s = box(.09,1.8,.48,C.wood); s.position.set(x,.9,0); shelfG.add(s);
}
for (const y of [.04,.84,1.64]){
  const b = box(1.5,.09,.48,C.wood); b.position.set(0,y,0); shelfG.add(b);
}
const bookColors = [C.red,C.yellow,C.blue,C.purple,0x8fc0a0,0xe79f8f];
let bi = 0;
for (let row=0; row<2; row++){
  for (let i=0;i<6;i++){
    const bh = .3 + (i%3)*.06;
    const bk = box(.12,bh,.3, bookColors[bi++%bookColors.length]);
    bk.position.set(-.55+i*.19, .085+row*.8+bh/2, .09);
    bk.rotation.z = (i%2?1:-1)*.02;
    shelfG.add(bk);
  }
}
const bear = sph(.16,0xd2a882,1,1.08,1,20); bear.position.set(-.42,1.76,.05); shelfG.add(bear);
for (const s of [-1,1]){
  const e = sph(.06,0xd2a882,1,1,.6,14); e.position.set(-.42+s*.11,1.88,.05); shelfG.add(e);
  const ey = sph(.022,C.eye,1,1,.6,12); ey.position.set(-.42+s*.055,1.78,.2); shelfG.add(ey);
}
const sucP = cyl(.12,.1,.2,C.pot,16); sucP.position.set(.34,1.72,.06); shelfG.add(sucP);
const sucL = sph(.1,C.leafD,1,1.7,.9,16); sucL.position.set(.34,1.96,.06); shelfG.add(sucL);
scene.add(shelfG);

/* 茶几 */
const tableG = new THREE.Group();
tableG.position.set(-1.25,0,1.15);
const ttop = cyl(.52,.52,.09,C.wood,32); ttop.position.y = .47; tableG.add(ttop);
const tleg = cyl(.085,.1,.47,C.woodD,20); tleg.position.y = .235; tableG.add(tleg);
const cup = cyl(.1,.085,.15,0xfffdf8,24); cup.position.set(-.14,.58,.05); tableG.add(cup);
const cupIn = cyl(.084,.084,.02,0xa9764e,20); cupIn.position.set(-.14,.655,.05); tableG.add(cupIn);
const handle = new THREE.Mesh(new THREE.TorusGeometry(.055,.02,10,24), mat(0xfffdf8,{roughness:.7}));
handle.position.set(-.03,.58,.05); handle.rotation.y = Math.PI/2; handle.castShadow = true; tableG.add(handle);
const saucer = cyl(.15,.15,.022,0xfffdf8,24); saucer.position.set(-.14,.515,.05); tableG.add(saucer);
const plate = cyl(.17,.17,.028,0xfff6ec,24); plate.position.set(.18,.51,-.13); tableG.add(plate);
for (let i=0;i<3;i++){
  const coo = cyl(.062,.062,.032,0xd9a06a,18);
  coo.position.set(.18+(i-1)*.065,.535,-.13+(i%2)*.055); tableG.add(coo);
}
scene.add(tableG);

/* 大盆栽 */
const plantG = new THREE.Group();
plantG.position.set(-2.5,0,-1.7);
const pot = cyl(.36,.26,.5,C.pot,28); pot.position.y = .25; plantG.add(pot);
const potRim = new THREE.Mesh(new THREE.TorusGeometry(.35,.05,12,32), mat(0xc0755a,{roughness:.85}));
potRim.position.y = .5; potRim.rotation.x = Math.PI/2; potRim.castShadow = true; plantG.add(potRim);
for (let i=0;i<10;i++){
  const a = i/10*Math.PI*2;
  const lf = sph(.21, i%2?C.leaf:C.leafD, .55, 1.1, .9, 18);
  lf.position.set(Math.cos(a)*.24, .66+(i%3)*.14, Math.sin(a)*.24);
  lf.rotation.z = Math.cos(a)*.85; lf.rotation.x = Math.sin(a)*.85;
  plantG.add(lf);
}
scene.add(plantG);

/* 小零食桶 & 碗 & 玩具 */
const bucketG = new THREE.Group();
bucketG.position.set(1.9,0,1.0);
const bk = cyl(.25,.2,.34,0xfdfbf4,28); bk.position.y = .17; bucketG.add(bk);
const bkS = cyl(.255,.255,.1,C.red,28); bkS.position.y = .21; bucketG.add(bkS);
for (let i=0;i<3;i++){
  const dr = sph(.105,0xd08a45,1,1.5,1,18);
  dr.position.set((i-1)*.115,.38,i%2?.02:-.03); dr.rotation.z = (i-1)*.3; bucketG.add(dr);
  const bn = cyl(.022,.022,.14,0xfffaf0,12);
  bn.position.set((i-1)*.115+(i-1)*.045,.49,i%2?.02:-.03); bn.rotation.z = (i-1)*.42; bucketG.add(bn);
}
scene.add(bucketG);

const bowlG = new THREE.Group();
bowlG.position.set(1.3,0,1.6);
const bowl = cyl(.27,.21,.16,C.red,28); bowl.position.y = .085; bowlG.add(bowl);
const bowlIn = cyl(.235,.235,.02,0x8a5a34,24); bowlIn.position.y = .15; bowlG.add(bowlIn);
for (let i=0;i<8;i++){
  const k = sph(.038,0x9a6838,1,.8,1,12);
  k.position.set((Math.random()-.5)*.22,.16,(Math.random()-.5)*.22); bowlG.add(k);
}
const wbowl = cyl(.25,.19,.14,0x9dc0dd,28); wbowl.position.set(-.64,.075,0); bowlG.add(wbowl);
const water = cyl(.21,.21,.02,0xbfe0f2,24); water.position.set(-.64,.145,0); bowlG.add(water);
scene.add(bowlG);

const tennis = sph(.17,0xd8e86a,1,1,1,24);
tennis.position.set(.5,.17,1.0); scene.add(tennis);
const tline = new THREE.Mesh(new THREE.TorusGeometry(.162,.018,10,32), mat(0xffffff,{roughness:.8}));
tline.position.copy(tennis.position); tline.rotation.set(Math.PI/2.6,.4,0); tline.castShadow = true; scene.add(tline);

for (const s of [-1,1]){
  const sl = box(.22,.08,.38,0xf0a8b4);
  sl.position.set(2.05+s*.3,.05,1.9-s*.14); sl.rotation.y = s*.24; scene.add(sl);
  const slT = box(.17,.07,.11,0xffdade);
  slT.position.set(2.05+s*.3,.1,1.76-s*.14); slT.rotation.y = s*.24; scene.add(slT);
}

const blanket = box(.52,.14,.42,0xf5c3ab); blanket.position.set(2.35,.08,.95); blanket.rotation.y = -.3; scene.add(blanket);
const blanket2 = box(.46,.1,.36,0xffdcca); blanket2.position.set(2.35,.19,.95); blanket2.rotation.y = -.22; scene.add(blanket2);

/* ================= hhz（Q 版） ================= */
function buildHuman(){
  const g = new THREE.Group();
  const S = new THREE.Group();
  g.add(S);

  /* 坐垫 */
  const cushion = sph(.54,C.rug2,1.15,.3,1.1,28);
  cushion.position.y = .09; S.add(cushion);

  /* 盘腿 */
  for (const s of [-1,1]){
    const leg = sph(.24,C.mintD,1.5,.6,.95,24);
    leg.position.set(s*.24,.21,.16); leg.rotation.z = -s*.26; S.add(leg);

let actx = null;
function blip(freq, dur, type){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const t0 = actx.currentTime;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(.04, t0+.014);
    g.gain.exponentialRampToValueAtTime(.0001, t0+(dur||.15));
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0+(dur||.15)+.03);
  }catch(_){}
}

/* ================= 相机 & 拖动（高灵敏度） ================= */
const YAW_K = 0.0145, PIT_K = 0.0100;
let yawT = .14, pitchT = 1.18, distT = 6.2;
let yaw = yawT, pitch = pitchT, dist = 9.5;
let spin = true, dragging = false, lastX = 0, lastY = 0, lastAct = 0, moved = 0;
const target = new THREE.Vector3(0,.85,.05);
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

function pick(cx, cy){
  ndc.x = (cx/innerWidth)*2-1;
  ndc.y = -(cy/innerHeight)*2+1;
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.intersectObject(corgi.userData.hit, false).length) return 'dog';
  if (raycaster.intersectObject(hitH, false).length) return 'human';
  return null;
}

gl.addEventListener('pointerdown', e=>{
  dragging = true; lastX = e.clientX; lastY = e.clientY; moved = 0;
  lastAct = performance.now();
  try { gl.setPointerCapture(e.pointerId); } catch(_){}
});
gl.addEventListener('pointermove', e=>{
  if (!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  yawT -= dx*YAW_K;
  pitchT = Math.min(1.54, Math.max(.72, pitchT - dy*PIT_K));
  lastAct = performance.now();
});
function endDrag(e){
  if (!dragging) return;
  dragging = false;
  try { gl.releasePointerCapture(e.pointerId); } catch(_){}
  lastAct = performance.now();
  if (moved < 10){
    const who = pick(e.clientX, e.clientY);
    if (who === 'dog') reactDog();
    else if (who === 'human') reactHuman();
  }
}
gl.addEventListener('pointerup', endDrag);
gl.addEventListener('pointercancel', endDrag);

let pinch = 0;
gl.addEventListener('touchstart', e=>{
  if (e.touches.length === 2){
    pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
}, {passive:true});
gl.addEventListener('touchmove', e=>{
  if (e.touches.length === 2 && pinch){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    distT = Math.min(9.5, Math.max(3.2, distT*(pinch/d)));
    pinch = d; lastAct = performance.now();
    e.preventDefault();
  }
}, {passive:false});
gl.addEventListener('touchend', ()=>{ pinch = 0; }, {passive:true});
gl.addEventListener('wheel', e=>{
  e.preventDefault();
  distT = Math.min(9.5, Math.max(3.2, distT + e.deltaY*.0035));
  lastAct = performance.now();
}, {passive:false});

  if (night){
    key.intensity = .7; key.color.set(0xbcd0ff);
    rim.intensity = 1.0; rim.color.set(0x9fb4ff);
    warmFill.intensity = 13;
    ambient.intensity = .22; ambient.color.set(0xc8d4ff);
    faceFill.intensity = 2.2; faceFill.color.set(0xc9d6ff);
    scene.background.set(0x2a3350); scene.fog.color.set(0x2a3350);
    wall.material.color.set(0x9aa8d0);
    floor.material.color.set(0x8e9ec4);
  } else {
    key.intensity = 2.5; key.color.set(0xffe8cf);
    rim.intensity = .85; rim.color.set(0xbfd4ff);
    warmFill.intensity = 9;
    ambient.intensity = .35; ambient.color.set(0xfff0e0);
    faceFill.intensity = 4.5; faceFill.color.set(0xfff2e0);
    scene.background.set(0xf6e2ce); scene.fog.color.set(0xf6e2ce);
    wall.material.color.set(0xffffff);
    floor.material.color.set(0xffffff);
  }
};
const bSpin = document.getElementById('bSpin');
bSpin.onclick = ()=>{ spin = !spin; bSpin.classList.toggle('on', spin); };
bSpin.classList.add('on');

/* ================= 标签定位 ================= */
const v3 = new THREE.Vector3();
function placeLabel(el, obj, dy){
  obj.getWorldPosition(v3); v3.y += dy;
  v3.project(camera);
  if (v3.z > 1 || v3.z < -1){ el.classList.remove('on'); return; }
  el.classList.add('on');
  const x = (v3.x*.5+.5)*innerWidth;
  const y = (-v3.y*.5+.5)*innerHeight;
  el.style.transform = 'translate(-50%,-100%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
}
const anchorDog = new THREE.Object3D(); anchorDog.position.set(0,1.5,.06); corgi.add(anchorDog);
const anchorMan = new THREE.Object3D(); anchorMan.position.set(0,1.95,.06); human.add(anchorMan);

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let blinkAt = 2.4, blinkT = 0, heartIdle = 6;
const chestLocal = new THREE.Vector3(.02,.62,.58);

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  const now = performance.now();

  /* 相机 */
  if (spin && !dragging && now-lastAct > 1400) yawT += dt*.17;
  yaw += (yawT-yaw)*.18;
  pitch += (pitchT-pitch)*.18;
  dist += (distT-dist)*.12;
  const cp = Math.cos(pitch), sp2 = Math.sin(pitch);
  camera.position.set(
    target.x + Math.sin(yaw)*sp2*dist,
    target.y + cp*dist,
    target.z + Math.cos(yaw)*sp2*dist
  );
  camera.lookAt(target);

  const U = corgi.userData;
  const rActive = react.kind && (now-react.t0) < react.dur;
  const rp = rActive ? (now-react.t0)/react.dur : 0;

  /* 呼吸 */
  const br = Math.sin(t*1.8)*.013;
  U.body.scale.set(1+br, 1+br*1.25, 1+br);
  U.body.position.y = br*1.4;

  /* 尾巴 / 头 / 耳朵 */
  U.tail.rotation.z = Math.sin(t*3.8)*.3;
  U.tail.rotation.x = Math.sin(t*2.5)*.13;
  U.head.rotation.y = Math.sin(t*.62)*.16 - .06;
  U.head.rotation.x = .04 + Math.sin(t*.88)*.05;
  U.head.rotation.z = Math.sin(t*.45)*.025;
  U.tongue.scale.y = .95 + Math.sin(t*5)*.12;
  for (let i=0;i<2;i++){
    const s = i?1:-1;
    U.ears[i].rotation.z = s*.17 + Math.sin(t*1.6+i)*.055;
    U.ears[i].rotation.x = -.1 + Math.sin(t*1.2+i)*.04;
  }

  /* 摸摸 */
  const petting = now < petUntil;
  if (petting){
    corgi.position.y = Math.abs(Math.sin(t*15))*.16;
    U.tail.rotation.z = Math.sin(t*26)*.6;
    U.head.rotation.z = Math.sin(t*12)*.09;
    U.eyes.forEach(e=>{ e.scale.y = .38; });
    human.userData.S.rotation.z = Math.sin(t*9)*.01;
  } else {
    U.eyes.forEach(e=>{
      blinkAt -= dt;
      if (blinkAt <= 0){ blinkT = .15; blinkAt = 2.8+Math.random()*3.4; }
      let eyeY = 1;
      if (blinkT > 0){ blinkT -= dt; eyeY = Math.max(.1, Math.abs(blinkT/.15-.5)*2); }
      e.scale.y = eyeY;
    });
  }

  /* 狗狗反应 */
  if (rActive && react.who === 'dog'){
    const k = Math.sin(rp*Math.PI);
    switch (react.kind){
      case 'jump': corgi.position.y = Math.abs(Math.sin(rp*Math.PI*3))*k*.4; break;
      case 'howl': U.head.rotation.x = .04 - k*.5; U.tongue.scale.y = .95 + k*.8; break;
      case 'spin': corgi.rotation.y = U.baseRotY + rp*Math.PI*4; break;
      case 'wag':
        U.tail.rotation.z = Math.sin(t*32)*.8*k;
        corgi.position.y = Math.abs(Math.sin(t*22))*.07*k;
        break;
      case 'tilt': U.head.rotation.z = k*.55; U.head.rotation.y = -.06 - k*.26; break;
      case 'belly':
        corgi.rotation.z = k*.85;
        corgi.position.y = k*.1;
        U.frontLegs.forEach(l=>{ l.rotation.x = -k*.7; });
        break;
      case 'toy': corgi.position.y = Math.abs(Math.sin(rp*Math.PI*2))*.18; U.tail.rotation.z = Math.sin(t*28)*.6; break;
      case 'nudge': U.head.rotation.x = .04 + k*.22; U.head.position.z = .26 + k*.1; break;
    }
  } else if (!rActive){
    corgi.rotation.z += (0-corgi.rotation.z)*.14;
    U.frontLegs.forEach(l=>{ l.rotation.x += (0-l.rotation.x)*.16; });
    U.head.position.z += (.26-U.head.position.z)*.14;
  }
  if (!(rActive && react.kind === 'spin')){
    const d = ((U.baseRotY - corgi.rotation.y + Math.PI*3) % (Math.PI*2)) - Math.PI;
    corgi.rotation.y += d*.15;
  }

  /* 抱抱 */
  const manU = human.userData;
  const chestWorld = human.localToWorld(chestLocal.clone());
  if (hugging){
    corgi.position.lerp(chestWorld, .11);
    const faceYaw = Math.atan2(camera.position.x - corgi.position.x, camera.position.z - corgi.position.z);
    let d = ((faceYaw - corgi.rotation.y + Math.PI*3) % (Math.PI*2)) - Math.PI;
    corgi.rotation.y += d*.11;
    corgi.rotation.z += (.05 - corgi.rotation.z)*.1;
    U.tail.rotation.z = Math.sin(t*20)*.55;
    U.head.rotation.x = .04 - .14 + Math.sin(t*3)*.05;
    manU.armL.quaternion.slerp(manU.qL, .12);
    manU.armR.quaternion.slerp(manU.qR, .12);
    manU.headG.rotation.x += ((.17 + Math.sin(t*2.4)*.03) - manU.headG.rotation.x)*.1;
    heartIdle -= dt*2.4;
    if (heartIdle <= 0){
      heartIdle = 1.2;
      const p = new THREE.Vector3();
      U.head.getWorldPosition(p); p.y += .32;
      spawnHearts(p, 2);
    }
  } else {
    corgi.position.lerp(U.basePos, .1);
    manU.armL.quaternion.slerp(new THREE.Quaternion(), .11);
    manU.armR.quaternion.slerp(new THREE.Quaternion(), .11);
    manU.headG.rotation.x += ((Math.sin(t*.9)*.035) - manU.headG.rotation.x)*.08;
  }
  if (!petting && !hugging && !(rActive && react.who === 'dog')){
    corgi.position.y += (U.basePos.y - corgi.position.y)*.14;
  }

  /* 人类反应 */
  if (rActive && react.who === 'human'){
    const k = Math.sin(rp*Math.PI);
    switch (react.kind){
      case 'nod': manU.headG.rotation.x = k*.2; break;
      case 'open': manU.armR.quaternion.slerp(manU.qR, .2*k); manU.headG.rotation.x = -k*.07; break;
      case 'hand':
        manU.armR.userData.hand.position.y = manU.armR.userData.hand0.y + k*.17;
        manU.headG.rotation.z = k*.09;
        break;
      case 'smile':
        manU.cheeks.forEach(c=>{ c.scale.set(1+k*.5,.62*(1+k*.4),.28); });
        manU.headG.rotation.z = k*.07;
        break;
      case 'lean': manU.S.rotation.x = k*.075; manU.headG.rotation.y = k*.18; break;
      case 'pet':
        manU.armR.userData.hand.position.y = manU.armR.userData.hand0.y - k*.12;
        U.head.rotation.z = k*.18;
        break;
      case 'pat': manU.S.position.y = Math.abs(Math.sin(rp*Math.PI*3))*k*.045; break;
      case 'shy':
        manU.headG.rotation.x = k*.18;
        manU.cheeks.forEach(c=>{ c.scale.set(1+k*.75,.62*(1+k*.5),.28); });
        break;
    }
  } else {
    manU.cheeks.forEach(c=>{
      c.scale.x += (1-c.scale.x)*.1;
      c.scale.y += (.62-c.scale.y)*.1;
    });
    manU.S.rotation.x += (0-manU.S.rotation.x)*.1;
    if (!(rActive && react.who === 'human')) manU.headG.rotation.y += (0-manU.headG.rotation.y)*.1;
  }

  /* 呼吸 */
  const hb = Math.sin(t*1.45)*.0085;
  manU.S.scale.set(1, 1+hb, 1);

  /* 串灯 */
  bulbs.forEach((b,i)=>{
    const k = .5+.5*Math.sin(t*2.1+i*.75);
    if (b.userData.warm) b.material.emissiveIntensity = 1.0 + k*1.1;
    else b.material.emissiveIntensity = .8 + k*.9;
  });

  /* 浮尘 */
  motes.forEach(m=>{
    m.position.y += Math.sin(t*m.userData.sp+m.userData.ph)*dt*.13;
    m.position.x += Math.cos(t*m.userData.sp*.8+m.userData.ph)*dt*.07;
  });

  /* 软阴影跟随 */
  dogShadow.position.set(corgi.position.x, .006, corgi.position.z);

  /* 爱心 */
  for (let i=hearts.length-1;i>=0;i--){
    const h = hearts[i], d = h.userData;
    d.age += dt;
    h.position.y += d.vy*dt;
    h.position.x += d.vx*dt;
    h.material.opacity = Math.max(0, 1-d.age/d.life);
    h.scale.multiplyScalar(1+dt*.38);
    if (d.age >= d.life){ scene.remove(h); h.material.dispose(); hearts.splice(i,1); }
  }
  if (!hugging){
    heartIdle -= dt;
    if (heartIdle <= 0){
      heartIdle = 6+Math.random()*4;
      const p = new THREE.Vector3();
      U.head.getWorldPosition(p); p.y += .5;
      spawnHearts(p, 2);
    }
  }

  placeLabel(tagDog, anchorDog, .18);
  placeLabel(tagMan, anchorMan, .1);

  if (bubbleEl.classList.contains('on')){
    const obj = bubbleOwner === 'human' ? manU.headG : U.head;
    obj.getWorldPosition(v3);
    v3.y += bubbleOwner === 'human' ? .95 : .78;
    v3.project(camera);
    if (v3.z <= 1){
      const x = (v3.x*.5+.5)*innerWidth;
      const y = (-v3.y*.5+.5)*innerHeight;
      bubbleEl.style.transform = 'translate(-50%,-100%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    }
  }

  renderer.render(scene, camera);
}

tick();
document.getElementById('boot').classList.add('hide');
setTimeout(()=>{
  const p = new THREE.Vector3();
  corgi.userData.head.getWorldPosition(p); p.y += .5;
  spawnHearts(p, 5);
}, 900);
</script>
