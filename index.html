<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>炸炸炸鸡 &amp; hhz · 像素小房间</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2a1b13;
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif}
canvas#gl{display:block;width:100%;height:100%;image-rendering:auto;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 44%,rgba(0,0,0,0) 44%,rgba(38,20,10,.40) 100%)}
canvas.lbl{position:fixed;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);
  opacity:0;transition:opacity .25s;z-index:3;will-change:transform,opacity;
  filter:drop-shadow(0 4px 10px rgba(60,30,10,.30))}
canvas.lbl.on{opacity:1}
canvas#bub{position:fixed;left:0;top:0;pointer-events:none;
  transform:translate(-50%,-100%) scale(.88);opacity:0;z-index:4;
  transition:opacity .15s,transform .15s cubic-bezier(.2,.9,.3,1.25);will-change:transform,opacity;
  filter:drop-shadow(0 8px 20px rgba(60,30,10,.28))}
canvas#bub.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:7px;
  padding:10px 10px calc(14px + env(safe-area-inset-bottom));z-index:6;flex-wrap:wrap}
#hud button{font-family:inherit;font-size:12.5px;font-weight:800;color:#3a2418;cursor:pointer;
  background:#ffe6c9;border:0;padding:9px 12px 10px;letter-spacing:.4px;
  box-shadow:0 -3px 0 0 #c99a6e inset,0 3px 0 0 #c99a6e inset,-3px 0 0 0 #c99a6e inset,3px 0 0 0 #c99a6e inset,0 6px 0 0 #7d5334;
  transition:transform .08s}
#hud button:active{transform:translateY(3px);
  box-shadow:0 -3px 0 0 #c99a6e inset,0 3px 0 0 #c99a6e inset,-3px 0 0 0 #c99a6e inset,3px 0 0 0 #c99a6e inset,0 3px 0 0 #7d5334}
#hud button.on{background:#ffce8a}
#top{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top));z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#top canvas{display:block}
#hint{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));
  text-align:center;font-size:11.5px;font-weight:700;color:rgba(255,231,205,.62);
  z-index:4;pointer-events:none;transition:opacity .5s;letter-spacing:.3px}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#2a1b13;z-index:20;
  color:#ffd9a8;font-size:13px;font-weight:700;transition:opacity .5s;letter-spacing:1px}
#boot.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="top"><canvas id="titleCv"></canvas><canvas id="subCv"></canvas></div>
<div id="hint">拖一下换角度 · 点点炸炸炸鸡和 hhz</div>
<div id="hud">
  <button id="bHug">抱抱</button>
  <button id="bPet">摸摸炸炸</button>
  <button id="bLight">换个光</button>
  <button id="bSpin" class="on">环绕</button>
</div>
<div id="boot">正在搭小房间…</div>

<script type="importmap">
{"imports":{"three":"./three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ================= 渲染 ================= */
const PIX = 1.0;   /* 1.0 = 全分辨率平滑渲染（迪士尼风） */
const gl = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas:gl, antialias:false, alpha:false});
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a1b13);
scene.fog = new THREE.Fog(0x3f2c1e, 17, 36);
const camera = new THREE.PerspectiveCamera(30, 1, .1, 90);

function resize(){
  const w = Math.max(180, Math.round(innerWidth / PIX));
  const h = Math.max(200, Math.round(innerHeight / PIX));
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

/* ================= 调色 ================= */
const C = {
  ink:0x4a3226,
  furA:0xf9bd82, furB:0xe89d55, cream:0xfffbf2,
  earIn:0xffbccb, blush:0xffa2b6, pinkD:0xff7f9e,
  scarf:0xff94af, scarfD:0xe9708d,
  skin:0xfbe0c4, hair:0x513729, mint:0xaadabc, mintD:0x88be9e,
  wood:0xe7c39e, woodD:0xc89c72, metal:0xccb197,
  leafA:0x84b77c, leafB:0x679e61, pot:0xd98160,
  rug2:0xffcab1, red:0xd95a51, yellow:0xf0ca89, blue:0x95b9d7, pinkie:0xda8b96
};

function gradMap(steps){
  const d = new Uint8Array(steps);
  for (let i=0;i<steps;i++) d[i] = Math.round(104 + (i/(steps-1))*151);
  const t = new THREE.DataTexture(d, steps, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true;
  return t;
}
const GRAD = gradMap(4);
const toon = (color, extra) => new THREE.MeshToonMaterial(Object.assign({color, gradientMap:GRAD}, extra || {}));
const INKMAT = new THREE.MeshBasicMaterial({color:C.ink, side:THREE.BackSide});
function ink(mesh, k){
  const m = new THREE.Mesh(mesh.geometry, INKMAT);
  m.scale.multiplyScalar(k || 1.04);
  mesh.add(m);
  return mesh;
}
function ball(r, color, sx, sy, sz, seg){
  sx = sx===undefined?1:sx; sy = sy===undefined?1:sy; sz = sz===undefined?1:sz;
  seg = seg || 24;
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(12, Math.round(seg*.7))), toon(color));
  m.scale.set(sx, sy, sz);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cube(w,h,d,color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), toon(color));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt,rb,h,color,seg){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16), toon(color));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cone(r,h,color,seg){
  const m = new THREE.Mesh(new THREE.ConeGeometry(r,h,seg||16), toon(color));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function limb(a, b, r, color){
  const dir = new THREE.Vector3().subVectors(b,a);
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(dir.length()-2*r,.01), 6, 14), toon(color));
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/* 椭球表面 z（保证五官不陷进去） */
function surfZ(cx, cy, cz, rx, ry, rz, x, y){
  const nx = (x-cx)/rx, ny = (y-cy)/ry;
  const k = 1 - nx*nx - ny*ny;
  return cz + rz*Math.sqrt(Math.max(.02, k));
}
function put(obj, x, y, z){
  obj.position.set(x, y, z);
  return obj;
}

/* ================= 灯光 ================= */
const hemi = new THREE.HemisphereLight(0xfff0dc, 0x8a6142, 1.15);
scene.add(hemi);

/* 主光：暖，柔，带软阴影 */
const key = new THREE.DirectionalLight(0xfff0d4, 2.35);
key.position.set(3.8, 7.0, 5.2);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 9; key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1; key.shadow.camera.far = 28;
key.shadow.bias = -0.0008;
key.shadow.radius = 4;
key.shadow.blurSamples = 16;
scene.add(key);

/* 补光：冷，压暗部避免死黑 */
const fill = new THREE.DirectionalLight(0xcfe0ff, .70);
fill.position.set(-5.5, 3.2, -2.4);
scene.add(fill);

/* 轮廓光：让毛发边缘透亮 */
const rim = new THREE.DirectionalLight(0xffcf9c, .85);
rim.position.set(-1.6, 3.2, 6.0);
scene.add(rim);

/* 环境反射：柔和丝绒感 */
const lampLight = new THREE.PointLight(0xffc48a, 5.5, 14, 2);
lampLight.position.set(2.4, 2.0, -0.4);
scene.add(lampLight);

/* ================= 贴图 ================= */
function tex(w, h, draw, repeat){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const floorTex = tex(16,16,(x)=>{
  x.fillStyle='#dcac78'; x.fillRect(0,0,16,16);
  x.fillStyle='#c9905c';
  for(let i=0;i<16;i+=8) x.fillRect(0,i,16,1);
  x.fillRect(7,0,1,8); x.fillRect(3,8,1,8);
  x.fillStyle='#eec28f'; x.fillRect(0,3,16,1); x.fillRect(0,11,16,1);
},[8,8]);
const wallTex = tex(16,32,(x)=>{
  const g = x.createLinearGradient(0,0,0,32);
  g.addColorStop(0,'#8e6347'); g.addColorStop(.55,'#a67954'); g.addColorStop(1,'#be9069');
  x.fillStyle=g; x.fillRect(0,0,16,32);
  x.fillStyle='rgba(255,238,214,.085)';
  for(let i=0;i<13;i++) x.fillRect((i*7)%16,(i*11)%32,1,1);
},[7,1]);
const rugTex = tex(24,24,(x)=>{
  x.fillStyle='#ffe9d6'; x.fillRect(0,0,24,24);
  x.fillStyle='#ffd8c2';
  for(let i=0;i<24;i+=4){ x.fillRect(i,0,2,1); x.fillRect(i,23,2,1); }
  for(let i=0;i<24;i+=4){ x.fillRect(0,i,1,2); x.fillRect(23,i,1,2); }
  x.fillStyle='#ffccb3';
  for(let i=6;i<18;i+=6) for(let j=6;j<18;j+=6) x.fillRect(i,j,2,2);
});
const skyTex = tex(20,20,(x)=>{
  const g = x.createLinearGradient(0,0,0,20);
  g.addColorStop(0,'#3d5b93'); g.addColorStop(.7,'#8aabd8'); g.addColorStop(1,'#ffcda6');
  x.fillStyle=g; x.fillRect(0,0,20,20);
  x.fillStyle='#fff8dc';
  [[4,3],[13,2],[8,6],[16,7],[6,8],[11,9],[17,4]].forEach(([a,b])=>x.fillRect(a,b,1,1));
  x.fillStyle='#fff3c4'; x.fillRect(11,3,2,2);
  x.fillStyle='#fffdf0'; x.fillRect(11,3,1,1);
});
const picTex = tex(20,20,(x)=>{
  x.fillStyle='#fff3dd'; x.fillRect(0,0,20,20);
  x.fillStyle='#a8c6e8'; x.fillRect(2,2,16,10);
  x.fillStyle='#8cb784'; x.fillRect(2,12,16,6);
  x.fillStyle='#f9bd82'; x.fillRect(8,9,5,4);
  x.fillStyle='#4a3226'; x.fillRect(9,10,1,1); x.fillRect(11,10,1,1);
  x.fillStyle='#fffbf2'; x.fillRect(9,12,3,2);
});
const picTex2 = tex(20,20,(x)=>{
  x.fillStyle='#ffe4ec'; x.fillRect(0,0,20,20);
  x.fillStyle='#ff7f9e';
  x.fillRect(7,5,5,4); x.fillRect(6,6,7,4); x.fillRect(7,9,5,3); x.fillRect(8,11,3,2);
  x.fillStyle='#fff'; x.fillRect(7,6,1,1);
});

/* ================= 房间 ================= */
const floor = new THREE.Mesh(new THREE.CircleGeometry(19,40), new THREE.MeshToonMaterial({map:floorTex, gradientMap:GRAD}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);

const rug = new THREE.Mesh(new THREE.CircleGeometry(2.85,40), new THREE.MeshToonMaterial({map:rugTex, gradientMap:GRAD}));
rug.rotation.x = -Math.PI/2; rug.position.y = .012; rug.receiveShadow = true;
scene.add(rug);
const rugRing = new THREE.Mesh(new THREE.RingGeometry(2.05,2.22,40), toon(C.rug2));
rugRing.rotation.x = -Math.PI/2; rugRing.position.y = .018;
scene.add(rugRing);
for (let i=0;i<32;i++){
  const a = i/32*Math.PI*2;
  const fg = cube(.05,.03,.16,C.rug2);
  fg.position.set(Math.cos(a)*2.88, .03, Math.sin(a)*2.88);
  fg.rotation.y = -a;
  scene.add(fg);
}

const wall = new THREE.Mesh(new THREE.PlaneGeometry(30,13), new THREE.MeshToonMaterial({map:wallTex, gradientMap:GRAD}));
wall.position.set(0,6.5,-5.1); wall.receiveShadow = true;
scene.add(wall);
scene.add(put(cube(30,.3,.16,C.woodD), 0, .15, -5.02));
scene.add(put(cube(30,.06,.2,C.wood), 0, .32, -5.0));

/* 窗 */
const winW = 2.9, winH = 2.4;
const wglass = new THREE.Mesh(new THREE.PlaneGeometry(winW,winH), new THREE.MeshBasicMaterial({map:skyTex}));
wglass.position.set(-2.75,3.4,-5.03); scene.add(wglass);
const wframe = new THREE.Mesh(new THREE.TorusGeometry(1.56,.1,4,4), toon(C.wood));
wframe.position.set(-2.75,3.4,-5.0); wframe.rotation.z = Math.PI/4; wframe.scale.set(1,.835,1);
scene.add(wframe);
scene.add(put(cube(.07,winH-.08,.07,C.wood), -2.75, 3.4, -4.99));
scene.add(put(cube(winW-.08,.07,.07,C.wood), -2.75, 3.4, -4.99));
scene.add(put(cube(winW+.5,.16,.36,C.wood), -2.75, 2.14, -4.9));
for (const s of [-1,1]){
  const cur = cube(.44,2.95,.12,0xffd1b0); put(cur, -2.75+s*1.84, 3.22, -4.88); cur.rotation.z = s*.03; scene.add(cur);
  scene.add(put(cube(.2,2.95,.14,0xffba96), -2.75+s*1.63, 3.22, -4.86));
}
scene.add(put(cube(winW+3.6,.09,.09,C.woodD), -2.75, 4.72, -4.86));
for (const s of [-1,1]) scene.add(put(ball(.1,C.wood,1,1,1,14), -2.75+s*(winW/2+1.8), 4.72, -4.86));
for (let i=0;i<3;i++){
  scene.add(put(cyl(.09,.07,.18,C.pot,12), -3.55+i*.3, 2.31, -4.84));
  scene.add(put(ball(.11, i%2?C.leafA:C.leafB, 1,1.25,.9,12), -3.55+i*.3, 2.48, -4.84));
}

/* 相框 */
function wallFrame(x,y,w,h,t){
  scene.add(put(cube(w+.16,h+.16,.07,C.wood), x, y, -5.0));
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:t}));
  p.position.set(x,y,-4.95); scene.add(p);
}
wallFrame(-.9,3.2,.85,.85,picTex);
wallFrame(.46,3.4,.62,.62,picTex2);
wallFrame(-.26,2.4,.55,.55,picTex2);

/* 串灯 */
const wirePts = [];
for (let i=0;i<=48;i++){
  const t = i/48;
  wirePts.push(-3.7+t*7.4, 2.9-Math.sin(t*Math.PI)*.62+.1, -4.82);
}
const wireGeo = new THREE.BufferGeometry();
wireGeo.setAttribute('position', new THREE.Float32BufferAttribute(wirePts,3));
scene.add(new THREE.Line(wireGeo, new THREE.LineBasicMaterial({color:0x5c4030})));
const bulbs = [];
for (let i=0;i<=13;i++){
  const t = i/13;
  const b = ball(.055,0xffffff,1,1.15,1,10);
  b.material = new THREE.MeshBasicMaterial({color:0xffcf92});
  b.userData = {warm: i%3 !== 0};
  b.position.set(-3.7+t*7.4, 2.9-Math.sin(t*Math.PI)*.62-.04, -4.82);
  scene.add(b); bulbs.push(b);
}

/* 挂钟 */
const clockG = new THREE.Group();
clockG.position.set(2.62,3.5,-4.95);
const cbody = cyl(.46,.46,.1,C.woodD,24); cbody.rotation.x = Math.PI/2; clockG.add(cbody);
const cface = cyl(.38,.38,.06,0xfff8ec,24); cface.rotation.x = Math.PI/2; cface.position.z = .07; clockG.add(cface);
const handH = cube(.045,.22,.03,C.ink); handH.position.set(0,.05,.11); clockG.add(handH);
const handM = cube(.035,.31,.03,C.ink); handM.position.set(0,.08,.13); clockG.add(handM);
clockG.add(put(ball(.05,C.pinkD,1,1,.5,10), 0, 0, .14));
scene.add(clockG);

/* 落地灯 */
const lampG = new THREE.Group();
lampG.position.set(2.55,0,-.4);
lampG.add(put(cyl(.055,.065,2.0,C.metal,12), 0, 1.0, 0));
lampG.add(put(cyl(.44,.5,.12,C.metal,20), 0, .06, 0));
const lshade = new THREE.Mesh(new THREE.ConeGeometry(.56,.66,20,1,true), toon(0xffe4b8,{side:THREE.DoubleSide, emissive:0x6b3d12}));
lshade.position.y = 2.12; lampG.add(lshade);
const lbulb = ball(.1,0xffffff,1,1,1,12); lbulb.material = new THREE.MeshBasicMaterial({color:0xfff2d4});
lbulb.position.y = 1.94; lampG.add(lbulb);
scene.add(lampG);

/* 大盆栽 */
const plantG = new THREE.Group();
plantG.position.set(-2.35,0,-1.55);
plantG.add(put(cyl(.34,.24,.46,C.pot,16), 0, .23, 0));
const potRim = new THREE.Mesh(new THREE.TorusGeometry(.33,.045,6,20), toon(0xc06b52));
potRim.position.y = .46; potRim.rotation.x = Math.PI/2; plantG.add(potRim);
for (let i=0;i<9;i++){
  const a = i/9*Math.PI*2;
  const lf = ball(.2, i%2?C.leafA:C.leafB, .55,1,.9,12);
  lf.position.set(Math.cos(a)*.22, .62+(i%3)*.13, Math.sin(a)*.22);
  lf.rotation.z = Math.cos(a)*.8; lf.rotation.x = Math.sin(a)*.8;
  plantG.add(lf);
}
scene.add(plantG);

/* 书架 */
const shelfG = new THREE.Group();
shelfG.position.set(1.95,0,-3.1);
for (const y of [.06,.82,1.58]) shelfG.add(put(cube(1.5,.1,.46,C.wood), 0, y, 0));
for (const x of [-.72,.72]) shelfG.add(put(cube(.1,1.72,.46,C.woodD), x, .86, 0));
shelfG.add(put(cube(1.44,1.7,.06,C.woodD), 0, .86, -.2));
const bookCols = [C.red,C.yellow,C.blue,C.pinkie,0x9dc5a7,0xbdafe1];
let bi = 0;
for (let row=0; row<2; row++){
  for (let i=0;i<6;i++){
    const bh = .32+(i%3)*.07;
    const bk = cube(.13,bh,.32, bookCols[bi++ % bookCols.length]);
    bk.position.set(-.56+i*.19, .11+row*.76+bh/2, .1);
    bk.rotation.z = (i%2?1:-1)*.02;
    shelfG.add(bk);
  }
}
shelfG.add(put(ball(.15,0xd3aa83,1,1.1,1,16), -.4, 1.78, .08));
[[-.45,1.82],[-.35,1.82]].forEach(([x,y])=>shelfG.add(put(cube(.035,.035,.02,C.ink), x, y, .2)));
[[-.53,1.9],[-.27,1.9]].forEach(([x,y])=>shelfG.add(put(ball(.05,0xd3aa83,1,1,.5,10), x, y, .08)));
shelfG.add(put(cyl(.11,.09,.2,C.pot,12), .3, 1.72, .08));
shelfG.add(put(ball(.1,C.leafB,1,1.6,.9,12), .3, 1.94, .08));
scene.add(shelfG);

/* 茶几 */
const tableG = new THREE.Group();
tableG.position.set(-1.15,0,1.15);
tableG.add(put(cyl(.5,.5,.09,C.wood,24), 0, .46, 0));
tableG.add(put(cyl(.08,.09,.46,C.woodD,12), 0, .23, 0));
tableG.add(put(cyl(.1,.08,.14,0xffffff,16), -.12, .57, .02));
tableG.add(put(cyl(.082,.082,.02,0x9a6540,16), -.12, .64, .02));
const tHandle = new THREE.Mesh(new THREE.TorusGeometry(.055,.018,6,12), toon(0xffffff));
tHandle.position.set(-.02,.57,.02); tHandle.rotation.y = Math.PI/2; tableG.add(tHandle);
tableG.add(put(cyl(.14,.14,.02,0xffffff,16), -.12, .51, .02));
tableG.add(put(cyl(.16,.16,.025,0xfff4e4,16), .16, .5, -.12));
for (let i=0;i<3;i++) tableG.add(put(cyl(.06,.06,.03,0xd39960,10), .16+(i-1)*.06, .53, -.12+(i%2)*.05));
scene.add(tableG);

/* 狗碗 */
const bowlG = new THREE.Group();

/* ================= 铲屎官 hhz ================= */
function buildHuman(){
  const g = new THREE.Group();
  const S = new THREE.Group();
  g.add(S);

  S.add(put(ball(.52,C.rug2,1.1,.32,1.05,20), 0, .1, 0));
  for (const s of [-1,1]){
    const leg = ball(.25,C.mintD,1.45,.62,.95,16);
    leg.position.set(s*.24,.22,.16); leg.rotation.z = -s*.28; S.add(leg);
    S.add(put(ball(.14,C.cream,1.1,.85,1,14), s*.36, .17, .46));
  }

  const torso = ball(.44,C.mint,1,1.18,.86,22); torso.position.set(0,.78,.02); ink(torso,1.045); S.add(torso);
  S.add(put(ball(.34,C.mintD,1,.65,.55,16), 0, 1.0, -.24));
  for (const x of [-.1,.1]){
    S.add(put(cube(.03,.17,.03,C.cream), x, .98, .36));
    S.add(put(cube(.05,.05,.05,0xffd18c), x, .88, .36));
  }
  S.add(put(cyl(.14,.16,.14,C.skin,14), 0, 1.2, .02));

  const headG = new THREE.Group();
  headG.position.set(0,1.22,.02);
  S.add(headG);

  const HR = {cx:0, cy:.24, cz:0, rx:.30, ry:.31, rz:.288};
  const head = ball(.30,C.skin,1,1.033,.96,26); head.position.set(0,.24,0); ink(head,1.035); headG.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(.315,26,16,0,Math.PI*2,0,Math.PI*.55), toon(C.hair));
  hair.position.set(0,.275,-.01); hair.scale.y = .96; ink(hair,1.03); headG.add(hair);
  headG.add(put(ball(.155,C.hair,1.5,.62,.85,18), -.05, .315, .195));
  headG.add(put(ball(.105,C.hair,.7,.95,.95,14), .272, .17, .015));
  headG.add(put(ball(.095,C.hair,.7,.95,.95,14), -.282, .17, .015));

  for (const x of [-.112,.112]){
    const ez = surfZ(HR.cx,HR.cy,HR.cz,HR.rx,HR.ry,HR.rz, x, .245) + .004;
    headG.add(put(cube(.048,.05,.028,C.ink), x, .245, ez));
    headG.add(put(cube(.017,.017,.012,0xffffff), x+.011, .26, ez+.016));
    const br = cube(.072,.015,.012,C.hair); br.position.set(x,.302,ez-.014); br.rotation.z = x>0?-.12:.12; headG.add(br);
  }
  const mz = surfZ(HR.cx,HR.cy,HR.cz,HR.rx,HR.ry,HR.rz, 0, .155) + .003;
  headG.add(put(cube(.068,.021,.012,C.pinkD), 0, .155, mz));
  const cheeks = [];
  for (const x of [-.195,.195]){
    const cz = surfZ(HR.cx,HR.cy,HR.cz,HR.rx,HR.ry,HR.rz, x, .18);
    const ch = ball(.056,C.blush,1,.62,.28,14); ch.position.set(x,.18,cz-.012); headG.add(ch); cheeks.push(ch);
  }

  const shL = new THREE.Vector3(-.38,1.04,.04), shR = new THREE.Vector3(.38,1.04,.04);
  function makeArm(sh, handRest){
    const grp = new THREE.Group();
    grp.position.copy(sh);
    const dir = handRest.clone().sub(sh);
    const seg = limb(new THREE.Vector3(0,0,0), dir.clone(), .105, C.mint); ink(seg,1.055); grp.add(seg);
    grp.add(put(ball(.135,C.mintD,1,1,1,14), dir.x*.26, dir.y*.26, dir.z*.26));
    const hand = ball(.12,C.skin,1,1,1,16); hand.position.copy(dir); grp.add(hand);
    grp.userData = {dir, hand, restDir:dir.clone().normalize(), hand0:dir.clone()};
    return grp;
  }
  const armL = makeArm(shL, new THREE.Vector3(-.66,.3,.34));
  const armR = makeArm(shR, new THREE.Vector3(.84,.95,.66));
  S.add(armL); S.add(armR);

  g.position.set(-.72,0,-.2);
  g.rotation.y = .24;

  const hugL = new THREE.Vector3(-.16,.76,.60).sub(shL).normalize();
  const hugR = new THREE.Vector3(.2,.88,.64).sub(shR).normalize();
  g.userData = {
    S, headG, cheeks, armL, armR,
    qL: new THREE.Quaternion().setFromUnitVectors(armL.userData.restDir, hugL),
    qR: new THREE.Quaternion().setFromUnitVectors(armR.userData.restDir, hugR)
  };
  return g;
}
const human = buildHuman();
scene.add(human);

function loadTex(url){
  const t = new THREE.TextureLoader().load(url);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  t.wrapS = THREE.RepeatWrapping;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  return t;
}

function buildCorgi(){
  const g = new THREE.Group();
  const body = new THREE.Group();
  g.add(body);

  /* ============ 身体：一个圆润的梨形 ============ */
  const torso = new THREE.Mesh(new THREE.SphereGeometry(.44, 96, 72), bodyMat);
  torso.scale.set(1.02, .95, 1.08);
  torso.position.set(0, .56, -.02);
  torso.castShadow = true; torso.receiveShadow = true;
  body.add(torso);

  /* 胸口白毛已画在躯干贴图里，无需额外几何体 */

  /* 后腿 */
  for (const s of [-1,1]){
    const hip = new THREE.Mesh(new THREE.SphereGeometry(.225, 56, 44), furMat);
    hip.scale.set(1, .96, 1.0);
    hip.position.set(s*.265, .27, -.09);
    hip.castShadow = true; body.add(hip);
    const hf = new THREE.Mesh(new THREE.SphereGeometry(.135, 48, 36), creamMat);
    hf.scale.set(1.02, .68, 1.22);
    hf.position.set(s*.265, .086, .10);
    body.add(hf);
  }
  /* 屁股 */
  const butt = new THREE.Mesh(new THREE.SphereGeometry(.255, 64, 48), creamMat);
  butt.scale.set(1.05, .94, .80);
  butt.position.set(0, .36, -.325);
  body.add(butt);

  /* ============ 前腿：短而圆 ============ */
  for (const s of [-1,1]){
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(.062, .105, 10, 24), furMat);
    leg.position.set(s*.148, .155, .370);
    leg.castShadow = true; body.add(leg);
    const paw = new THREE.Mesh(new THREE.SphereGeometry(.078, 48, 36), creamMat);
    paw.scale.set(1.10, .74, 1.28);
    paw.position.set(s*.148, .054, .425);
    paw.castShadow = true; body.add(paw);
    /* 肉垫：极小的粉点 */
    for (let i=-1;i<=1;i++){
      const pad = new THREE.Mesh(new THREE.SphereGeometry(.019, 20, 16), pinkMat);
      pad.scale.set(1, .8, 1);
      pad.position.set(s*.145 + i*.038, .050, .516);
      body.add(pad);
    }
  }

  /* 尾巴：小小绒球 */
  const tail = new THREE.Group();
  tail.position.set(0, .50, -.455);
  const tb = new THREE.Mesh(new THREE.SphereGeometry(.105, 48, 36), creamMat);
  tb.position.set(0, .02, -.05); tb.castShadow = true; tail.add(tb);
  body.add(tail);

  /* 脖子：露出一小段，形成迪士尼式的"抬头"姿势 */
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.135, .165, .17, 48, 1), furMat);
  neck.position.set(0, .985, .05);
  neck.castShadow = true;
  body.add(neck);

  /* ============ 头 ============ */
  const head = new THREE.Group();
  head.position.set(0, 1.19, .06);
  body.add(head);
  const HR = .425;

  /* 头骨：略扁的卵形 */
  const skull = new THREE.Mesh(new THREE.SphereGeometry(HR, 128, 96), headMat);
  skull.scale.set(1.06, .955, .95);
  skull.castShadow = true; skull.receiveShadow = true;
  head.add(skull);

  /* 两颊：改用头部贴图上的浅色渐显，不再加实体球 */


  /* ============ 口鼻：小、圆、干净 ============ */
  const MZ = {x:0, y:-.185, z:.315};
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(.128, 72, 56), creamMat);
  muzzle.scale.set(1.30, .88, 1.02);
  muzzle.position.set(MZ.x, MZ.y, MZ.z);
  muzzle.castShadow = true;
  head.add(muzzle);

  /* 鼻子：湿润感（低粗糙度 + 高光） */
  const nose = new THREE.Mesh(new THREE.SphereGeometry(.048, 48, 36), noseMat);
  nose.scale.set(1.32, .90, .92);
  nose.position.set(0, -.132, MZ.z + .128);
  head.add(nose);
  const noseHi = new THREE.Mesh(new THREE.SphereGeometry(.016, 24, 18), new THREE.MeshBasicMaterial({color:0xffffff}));
  noseHi.position.set(-.014, -.116, MZ.z + .168);
  noseHi.scale.set(1.1, .8, .6);
  head.add(noseHi);

  /* 嘴：一条柔和的微笑弧 */
  const smile = new THREE.Mesh(new THREE.TorusGeometry(.042, .0072, 10, 28, Math.PI*0.92), inkMat);
  smile.position.set(0, -.216, MZ.z + .100);
  smile.rotation.set(0, 0, Math.PI*0.04);
  head.add(smile);

  /* 舌头 */
  const tongue = new THREE.Mesh(new THREE.SphereGeometry(.036, 32, 24), tongueMat);
  tongue.scale.set(.92, 1.05, .46);
  tongue.position.set(0, -.246, MZ.z + .086);
  head.add(tongue);

  /* ============ 眼睛：迪士尼核心 —— 大、亮、有眼白 ============ */
  const eyes = [];
  for (const s of [-1,1]){
    const eyeG = new THREE.Group();
    const ex = s*.176, ey = .052;
    eyeG.position.set(ex, ey, surfZ(0,0,0,HR*1.06,HR*.955,HR*.95, ex, ey) - .052);
    eyeG.rotation.y = s*.30;

    /* 眼白（杏仁形，略扁） */
    const white = new THREE.Mesh(new THREE.SphereGeometry(.098, 48, 36), whiteMat);
    white.scale.set(1.0, 1.12, .55);
    eyeG.add(white);

    /* 虹膜（深棕，带渐变感） */
    const iris = new THREE.Mesh(new THREE.SphereGeometry(.082, 48, 36), irisMat);
    iris.scale.set(1.0, 1.10, .42);
    iris.position.set(0, 0, .036);
    eyeG.add(iris);

    /* 瞳孔 */
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(.058, 40, 30), pupilMat);
    pupil.scale.set(1.0, 1.08, .38);
    pupil.position.set(0, .002, .060);
    eyeG.add(pupil);

    /* 主高光：大而亮，放右上 */
    const hl1 = new THREE.Mesh(new THREE.SphereGeometry(.032, 28, 22), new THREE.MeshBasicMaterial({color:0xffffff}));
    hl1.scale.set(1, 1, .42);
    hl1.position.set(.022, .030, .082);
    eyeG.add(hl1);
    /* 次高光：左下小点 */
    const hl2 = new THREE.Mesh(new THREE.SphereGeometry(.014, 20, 16), new THREE.MeshBasicMaterial({color:0xffffff}));
    hl2.scale.set(1, 1, .42);
    hl2.position.set(-.026, -.030, .082);
    eyeG.add(hl2);

    /* 上眼睑：用一小片深色球面压住眼白上缘，形成自然眼皮（不是画线） */
    const lid = new THREE.Mesh(new THREE.SphereGeometry(.100, 40, 30, 0, Math.PI*2, 0, Math.PI*0.42), furMat);
    lid.scale.set(1.0, 1.10, .60);
    lid.position.set(0, .016, -.004);
    lid.rotation.x = -.16;
    eyeG.add(lid);

    head.add(eyeG); eyes.push(eyeG);
  }

  /* 黄褐色圆点眉 */
  for (const s of [-1,1]){
    const bz = surfZ(0,0,0,HR*1.06,HR*.955,HR*.95, s*.170, .215);
    const brow = new THREE.Mesh(new THREE.SphereGeometry(.044, 32, 24), browMat);
    brow.scale.set(1.35, .62, .30);
    brow.position.set(s*.170, .215, bz - .012);
    head.add(brow);
  }

  /* 腮红：极淡，柔边 */
  for (const s of [-1,1]){
    const cz = surfZ(0,0,0,HR*1.06,HR*.955,HR*.95, s*.268, -.115);
    const bl = new THREE.Mesh(new THREE.SphereGeometry(.082, 40, 30), blushMat);
    bl.scale.set(1, .78, .16);
    bl.position.set(s*.268, -.115, cz - .020);
    head.add(bl);
  }

  /* ============ 耳朵：圆润立耳 ============ */
  const ears = [];
  for (const s of [-1,1]){
    const ear = new THREE.Group();
    ear.position.set(s*.205, .235, -.045);
    ear.rotation.z = s*.34;
    ear.rotation.x = -.04;

    /* 外耳：宽底圆顶，长度只有宽度的 1.35 倍 */
    const outer = new THREE.Mesh(new THREE.SphereGeometry(.128, 56, 44), furMat);
    outer.scale.set(1.0, 1.38, .58);
    outer.position.y = .092;
    outer.castShadow = true;
    ear.add(outer);

    /* 内耳粉色，贴合外耳内壁 */
    const inner = new THREE.Mesh(new THREE.SphereGeometry(.098, 48, 36), earMat);
    inner.scale.set(.62, 1.26, .24);
    inner.position.set(0, .105, .052);
    ear.add(inner);

    head.add(ear); ears.push(ear);
  }

  /* ============ 围巾 ============ */
  const scarf = new THREE.Mesh(new THREE.TorusGeometry(.222, .054, 20, 64), scarfMat);
  scarf.position.set(0, .795, .045);
  scarf.rotation.x = Math.PI/2 - .16;
  scarf.scale.set(1, 1, .92);
  scarf.castShadow = true;
  body.add(scarf);
  const knot = new THREE.Mesh(new THREE.SphereGeometry(.052, 32, 24), scarfDMat);
  knot.position.set(0, .775, .268);
  body.add(knot);
  for (const s of [-1,1]){
    const bow = new THREE.Mesh(new THREE.SphereGeometry(.052, 32, 24), scarfDMat);
    bow.scale.set(1.30, .84, .52);
    bow.position.set(s*.075, .778, .281);
    bow.rotation.z = s*.26;
    body.add(bow);
  }

  g.position.set(.92, 0, .42);
  g.rotation.y = -.5;
  g.scale.setScalar(.82);

  const hit = new THREE.Mesh(new THREE.SphereGeometry(.95, 10, 8), new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(0, .7, .06); g.add(hit);

  g.userData = {body, head, ears, tail, eyes, tongue, hit, baseRotY:-.5, basePos:g.position.clone()};
  return g;
}

scene.add(corgi);

const motes = [];
for (let i=0;i<22;i++){

/* ================= 高清文字 ================= */
const DPR = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
function rr(x, px, py, w, h, r){
  x.beginPath();
  x.moveTo(px+r, py);
  x.arcTo(px+w, py, px+w, py+h, r);
  x.arcTo(px+w, py+h, px, py+h, r);
  x.arcTo(px, py+h, px, py, r);
  x.arcTo(px, py, px+w, py, r);
  x.closePath();
}
function makeText(text, opt){
  opt = opt || {};
  const fs = opt.fs || 13;
  const padX = opt.padX != null ? opt.padX : (opt.bg ? 11 : 2);
  const padY = opt.padY != null ? opt.padY : (opt.bg ? 7 : 2);
  const font = '700 ' + fs + 'px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif';
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = font;
  const tw = Math.ceil(meas.measureText(text).width);
  const w = tw + padX*2;
  const h = fs + padY*2;
  const c = document.createElement('canvas');
  c.width = Math.ceil(w*DPR); c.height = Math.ceil(h*DPR);
  const x = c.getContext('2d');
  x.scale(DPR,DPR);
  x.font = font; x.textBaseline = 'middle'; x.textAlign = 'left';
  if (opt.bg){
    x.fillStyle = opt.border || '#4a3226';
    rr(x, 0, 0, w, h, 8); x.fill();
    x.fillStyle = opt.bg;
    rr(x, 1.6, 1.6, w-3.2, h-3.2, 6.6); x.fill();
    if (opt.tail){
      x.fillStyle = opt.border || '#4a3226';
      x.beginPath(); x.moveTo(w/2-5, h-2); x.lineTo(w/2, h+4); x.lineTo(w/2+5, h-2); x.closePath(); x.fill();
      x.fillStyle = opt.bg;
      x.beginPath(); x.moveTo(w/2-3.2, h-2.6); x.lineTo(w/2, h+2.2); x.lineTo(w/2+3.2, h-2.6); x.closePath(); x.fill();
    }
  }
  if (opt.shadow){
    x.fillStyle = opt.border || '#2a1b13';
    x.fillText(text, padX+1.2, h/2+1.2);
  }
  x.fillStyle = opt.fg || '#fff';
  x.fillText(text, padX, h/2);
  c.style.width = w+'px'; c.style.height = h+'px';
  return c;
}

let actx = null;
function blip(freq, dur, type){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    gn.gain.value = .0001;
    o.connect(gn); gn.connect(actx.destination);
    const t0 = actx.currentTime;
    gn.gain.exponentialRampToValueAtTime(.038, t0+.012);
    gn.gain.exponentialRampToValueAtTime(.0001, t0+(dur||.14));
    o.start(t0); o.stop(t0+(dur||.14)+.02);
  }catch(_){}
}

const YAW_K = 0.0145, PIT_K = 0.0100;
let yawT = .18, pitchT = 1.17, distT = 6.2;
let yaw = yawT, pitch = pitchT, dist = 9.5;
let spin = true, dragging = false, lastX = 0, lastY = 0, lastAct = 0, moved = 0;

function pick(cx, cy){
  ndc.x = (cx/innerWidth)*2-1;
  ndc.y = -(cy/innerHeight)*2+1;
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.intersectObject(corgi.userData.hit, false).length) return 'dog';
  if (raycaster.intersectObject(hitH, false).length) return 'human';
  return null;
}

gl.addEventListener('pointerdown', e=>{
  dragging = true; lastX = e.clientX; lastY = e.clientY; moved = 0;
  lastAct = performance.now();
  try { gl.setPointerCapture(e.pointerId); } catch(_){}
});
gl.addEventListener('pointermove', e=>{
  if (!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  yawT -= dx*YAW_K;
  pitchT = Math.min(1.55, Math.max(.72, pitchT-dy*PIT_K));
  lastAct = performance.now();
});
function endDrag(e){
  if (!dragging) return;
  dragging = false;
  try { gl.releasePointerCapture(e.pointerId); } catch(_){}
  lastAct = performance.now();
  if (moved < 10){
    const who = pick(e.clientX, e.clientY);
    if (who === 'dog') reactDog(true);
    else if (who === 'human') reactHuman(true);
  }
}
gl.addEventListener('pointerup', endDrag);
gl.addEventListener('pointercancel', endDrag);

let pinch = 0;
gl.addEventListener('touchstart', e=>{
  if (e.touches.length === 2){
    pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
}, {passive:true});
gl.addEventListener('touchmove', e=>{
  if (e.touches.length === 2 && pinch){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    distT = Math.min(10, Math.max(3.1, distT*(pinch/d)));
    pinch = d; lastAct = performance.now();
    e.preventDefault();
  }
}, {passive:false});
gl.addEventListener('touchend', ()=>{ pinch = 0; }, {passive:true});
gl.addEventListener('wheel', e=>{
  e.preventDefault();
  distT = Math.min(10, Math.max(3.1, distT+e.deltaY*.0035));
  lastAct = performance.now();
}, {passive:false});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let blinkAt = 2.2, blinkT = 0, heartIdle = 4;
const _q = new THREE.Quaternion();
const _p = new THREE.Vector3();

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  const now = performance.now();
  const U = corgi.userData;
  const manU = human.userData;

  if (spin && !dragging && now-lastAct > 1400) yawT += dt*.16;
  yaw += (yawT-yaw)*.18;
  pitch += (pitchT-pitch)*.18;
  dist += (distT-dist)*.12;
  const cp = Math.cos(pitch), sp2 = Math.sin(pitch);
  camera.position.set(
    target.x + Math.sin(yaw)*sp2*dist,
    target.y + cp*dist,
    target.z + Math.cos(yaw)*sp2*dist
  );
  camera.lookAt(target);

  const rActive = react.kind && (now-react.t0) < react.dur;
  const rp = rActive ? (now-react.t0)/react.dur : 0;

  /* 待机呼吸 */
  const br = Math.sin(t*1.7)*.013;
  U.body.scale.set(1+br, 1+br*1.3, 1+br);
  U.body.position.y = br*1.4;
  U.tail.rotation.z = Math.sin(t*3.6)*.26;
  U.tail.rotation.x = Math.sin(t*2.4)*.11;
  U.head.rotation.y = Math.sin(t*.6)*.15-.06;
  U.head.rotation.x = Math.sin(t*.85)*.045;
  U.head.rotation.z = Math.sin(t*.42)*.028;
  U.tongue.scale.y = 1.25+Math.sin(t*6)*.1;
  for (let i=0;i<2;i++){
    const s = i?1:-1;
    U.ears[i].rotation.z = s*.2+Math.sin(t*1.5+i)*.05;
  }

  /* 摸摸 */
  const petting = now < petUntil;
  if (petting){
    corgi.position.y = Math.abs(Math.sin(t*15))*.16;
    U.tail.rotation.z = Math.sin(t*24)*.58;
    U.head.rotation.z = Math.sin(t*11)*.08;
    U.eyes.forEach(e=>{ e.scale.y = .3; });
    manU.S.rotation.z = Math.sin(t*9)*.012;
    manU.armR.userData.hand.position.y = manU.armR.userData.hand0.y+Math.sin(t*13)*.045;
  } else {
    blinkAt -= dt;
    if (blinkAt <= 0){ blinkT = .16; blinkAt = 2.6+Math.random()*3.2; }
    let eyeY = 1;
    if (blinkT > 0){ blinkT -= dt; eyeY = Math.max(.14, Math.abs(blinkT/.16-.5)*2); }
    U.eyes.forEach(e=>{ e.scale.y = eyeY; });
  }

  /* 狗狗反应 */
  if (rActive && react.who === 'dog'){
    const k = Math.sin(rp*Math.PI);
    if (react.kind === 'jump') corgi.position.y = Math.abs(Math.sin(rp*Math.PI*3))*k*.4;
    else if (react.kind === 'howl'){ U.head.rotation.x = -k*.48; U.tongue.scale.y = 1.25+k*.7; }
    else if (react.kind === 'spin') corgi.rotation.y = U.baseRotY + rp*Math.PI*4;
    else if (react.kind === 'wag'){ U.tail.rotation.z = Math.sin(t*30)*.7*k; corgi.position.y = Math.abs(Math.sin(t*22))*.08*k; }
    else if (react.kind === 'tilt'){ U.head.rotation.z = k*.55; U.head.rotation.y = -k*.22; }
    else if (react.kind === 'roll' || react.kind === 'belly'){ corgi.rotation.z = k*.82; corgi.position.y = k*.1; }
    else if (react.kind === 'toy'){ corgi.position.y = Math.abs(Math.sin(rp*Math.PI*2))*.19; U.tail.rotation.z = Math.sin(t*26)*.56; }
  } else if (!rActive){
    corgi.rotation.z += (0-corgi.rotation.z)*.14;
  }
  if (!(rActive && react.kind === 'spin')){
    const d = ((U.baseRotY-corgi.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
    corgi.rotation.y += d*.14;
  }

  /* 抱抱 */
  if (hugging){
    _p.copy(chestLocal); human.localToWorld(_p);
    corgi.position.lerp(_p, .12);
    const faceYaw = Math.atan2(camera.position.x-corgi.position.x, camera.position.z-corgi.position.z);
    const d = ((faceYaw-corgi.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
    corgi.rotation.y += d*.1;
    corgi.rotation.z += (.05-corgi.rotation.z)*.1;
    U.tail.rotation.z = Math.sin(t*18)*.5;
    U.head.rotation.x = -.08+Math.sin(t*3)*.05;
    manU.armL.quaternion.slerp(manU.qL, .13);
    manU.armR.quaternion.slerp(manU.qR, .13);
    manU.headG.rotation.x += ((.15+Math.sin(t*2.4)*.03)-manU.headG.rotation.x)*.1;
    heartIdle -= dt*2;
    if (heartIdle <= 0){
      heartIdle = 1.1;
      U.head.getWorldPosition(_p); _p.y += .3;
      spawnHearts(_p, 2);
    }
  } else {
    corgi.position.lerp(U.basePos, .1);
    manU.armL.quaternion.slerp(_q, .12);
    manU.armR.quaternion.slerp(_q, .12);
    manU.headG.rotation.x += ((Math.sin(t*.9)*.04)-manU.headG.rotation.x)*.08;
  }
  if (!hugging && !petting && !(rActive && react.who === 'dog')){
    corgi.position.y += (U.basePos.y-corgi.position.y)*.14;
  }

  /* 人类反应 */
  if (rActive && react.who === 'human'){
    const k = Math.sin(rp*Math.PI);
    if (react.kind === 'nod') manU.headG.rotation.x = k*.2;
    else if (react.kind === 'open'){ manU.armR.quaternion.slerp(manU.qR, .18*k); manU.headG.rotation.x = -k*.08; }
    else if (react.kind === 'hand'){ manU.armR.userData.hand.position.y = manU.armR.userData.hand0.y+k*.18; manU.headG.rotation.z = k*.1; }
    else if (react.kind === 'smile'){ manU.cheeks.forEach(c=>{ c.scale.set(1+k*.45,.62+k*.3,.28); }); manU.headG.rotation.z = k*.07; }
    else if (react.kind === 'lean'){ manU.S.rotation.x = k*.08; manU.headG.rotation.y = k*.18; }
    else if (react.kind === 'pet'){ manU.armR.userData.hand.position.y = manU.armR.userData.hand0.y-k*.1; U.head.rotation.z = k*.18; }
    else if (react.kind === 'pat'){ manU.S.position.y = Math.abs(Math.sin(rp*Math.PI*3))*k*.045; }
    else if (react.kind === 'shy'){ manU.headG.rotation.x = k*.18; manU.cheeks.forEach(c=>{ c.scale.set(1+k*.6,.62+k*.4,.28); }); }
  } else {
    manU.cheeks.forEach(c=>{ c.scale.x += (1-c.scale.x)*.1; c.scale.y += (.62-c.scale.y)*.1; });
    manU.S.rotation.x += (0-manU.S.rotation.x)*.1;
    manU.S.position.y += (0-manU.S.position.y)*.12;
    if (!petting) manU.armR.userData.hand.position.y += (manU.armR.userData.hand0.y-manU.armR.userData.hand.position.y)*.12;
    if (!(rActive && react.who === 'human')) manU.headG.rotation.y += (0-manU.headG.rotation.y)*.1;
  }

  /* 环境 */
  const hb = Math.sin(t*1.4)*.009;
  manU.S.scale.set(1, 1+hb, 1);
  bulbs.forEach((b,i)=>{
    const k = .5+.5*Math.sin(t*2.2+i*.8);
    if (b.userData.warm) b.material.color.setRGB(1,.74+k*.2,.42+k*.3);
    else b.material.color.setRGB(1,.66+k*.16,.72+k*.18);
  });
  motes.forEach(m=>{
    m.position.y += Math.sin(t*m.userData.sp+m.userData.ph)*dt*.12;
    m.position.x += Math.cos(t*m.userData.sp*.8+m.userData.ph)*dt*.06;
  });
  handH.rotation.z = -(t*.02);
  handM.rotation.z = -(t*.24);

  for (let i=hearts.length-1;i>=0;i--){
    const h = hearts[i], d = h.userData;
    d.age += dt;
    h.position.y += d.vy*dt;
    h.position.x += d.vx*dt;
    h.material.opacity = Math.max(0, 1-d.age/d.life);
    h.scale.multiplyScalar(1+dt*.4);
    if (d.age >= d.life){ scene.remove(h); h.material.dispose(); hearts.splice(i,1); }
  }
  if (!hugging){
    heartIdle -= dt;
    if (heartIdle <= 0){
      heartIdle = 5.5+Math.random()*4;
      U.head.getWorldPosition(_p); _p.y += .45;
      spawnHearts(_p, 2);
    }
  }

  placeLabel(tagDog, anchorDog, .1);
  placeLabel(tagH, anchorH, .06);
  if (bubble && bubble.classList.contains('on')){
    const obj = bubbleOwner === 'human' ? manU.headG : U.head;
    obj.getWorldPosition(v3);
    v3.y += bubbleOwner === 'human' ? .95 : .8;
    v3.project(camera);
    if (v3.z <= 1){
      const x = (v3.x*.5+.5)*innerWidth, y = (-v3.y*.5+.5)*innerHeight;
      bubble.style.transform = 'translate(-50%,-100%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    }
  }

  renderer.render(scene, camera);
}
loop();
document.getElementById('boot').classList.add('hide');
setTimeout(()=>{
  const p = new THREE.Vector3();
  corgi.userData.head.getWorldPosition(p); p.y += .45;
  spawnHearts(p, 5);
}, 800);
</script>
</body>
