<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>炸炸炸鸡 &amp; hhz · 像素小房间</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2a1b13;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
canvas#gl{display:block;width:100%;height:100%;image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(38,20,10,.45) 100%)}
.lbl{position:fixed;left:0;top:0;image-rendering:pixelated;pointer-events:none;
  transform:translate(-50%,-100%);opacity:0;transition:opacity .25s;z-index:3}
.lbl.on{opacity:1}
#bub{position:fixed;left:0;top:0;image-rendering:pixelated;pointer-events:none;
  transform:translate(-50%,-100%) scale(.8);opacity:0;transition:opacity .18s,transform .18s;z-index:4}
#bub.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:7px;
  padding:10px 10px calc(14px + env(safe-area-inset-bottom));z-index:6;flex-wrap:wrap}
#hud button{font-family:inherit;font-size:12.5px;font-weight:800;color:#3a2418;cursor:pointer;
  background:#ffe6c9;border:0;padding:9px 12px 10px;letter-spacing:.4px;
  box-shadow:0 -3px 0 0 #c99a6e inset,0 3px 0 0 #c99a6e inset,-3px 0 0 0 #c99a6e inset,3px 0 0 0 #c99a6e inset,0 6px 0 0 #7d5334;
  transition:transform .08s}
#hud button:active{transform:translateY(3px);box-shadow:0 -3px 0 0 #c99a6e inset,0 3px 0 0 #c99a6e inset,-3px 0 0 0 #c99a6e inset,3px 0 0 0 #c99a6e inset,0 3px 0 0 #7d5334}
#hud button.on{background:#ffce8a}
#top{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top));z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
#top canvas{image-rendering:pixelated;display:block}
#hint{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));
  text-align:center;font-size:11px;font-weight:700;color:rgba(255,231,205,.6);
  z-index:4;pointer-events:none;transition:opacity .5s;letter-spacing:.4px}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#2a1b13;z-index:20;
  color:#ffd9a8;font-size:13px;font-weight:700;transition:opacity .5s;letter-spacing:1px}
#boot.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="top"><canvas id="titleCv"></canvas><canvas id="subCv"></canvas></div>
<div id="hint">拖一下换角度 · 点点炸炸炸鸡和 hhz</div>
<div id="hud">
  <button id="bHug">抱抱</button>
  <button id="bPet">摸摸炸炸</button>
  <button id="bLight">换个光</button>
  <button id="bSpin" class="on">环绕</button>
</div>
<div id="boot">正在搭像素小房间…</div>

<script type="importmap">
{"imports":{"three":"./three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ========== 像素渲染 ========== */
const PIX = 2.6;
const gl = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas:gl, antialias:false, alpha:false});
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a1b13);
scene.fog = new THREE.Fog(0x3d2a1d, 14, 32);
const camera = new THREE.PerspectiveCamera(30, 1, .1, 90);

function resize(){
  const w = Math.max(140, Math.round(innerWidth / PIX));
  const h = Math.max(160, Math.round(innerHeight / PIX));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

/* ========== 调色 ========== */
const C = {
  ink:0x3a2418, wallA:0x8a5f42, wallB:0xb98a63,
  rug2:0xffc0a6, furA:0xf5a95e, furB:0xe0873f, creamC:0xfff4e6,
  pink:0xffb3c0, pinkD:0xff7f9e, scarf:0xff8fa8,
  hair:0x4a3226, skin:0xf8d5b8, mint:0x9ed3b4, mintD:0x7fb797,
  wood:0xe0b184, woodD:0xc2905f, metal:0xc9ab8e,
  leafA:0x76a86e, leafB:0x5f9159, pot:0xd3795a,
  meat:0xc8752f, bone:0xfff4e6,
  red:0xd94f4f, yellow:0xe8c07a, blue:0x8ab0c9, pinkie:0xd98a86
};

function gradMap(steps){
  const d = new Uint8Array(steps);
  for (let i=0;i<steps;i++) d[i] = Math.round(70 + (i/(steps-1))*185);
  const t = new THREE.DataTexture(d, steps, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true;
  return t;
}
const GRAD = gradMap(3);
const toon = (color, extra={}) => new THREE.MeshToonMaterial(Object.assign({color, gradientMap:GRAD}, extra));
const INKMAT = new THREE.MeshBasicMaterial({color:C.ink, side:THREE.BackSide});
function ink(mesh, k=1.12){
  const m = new THREE.Mesh(mesh.geometry, INKMAT);
  m.scale.multiplyScalar(k);
  mesh.add(m);
  return mesh;
}
function ball(r, color, sx=1, sy=1, sz=1, seg=14){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(8, seg-2)), toon(color));
  m.scale.set(sx, sy, sz); m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cube(w,h,d,color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), toon(color));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt,rb,h,color,seg=12){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), toon(color));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function limb(a, b, r, color){
  const dir = new THREE.Vector3().subVectors(b,a);
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(dir.length()-2*r,.01), 4, 10), toon(color));
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ========== 灯光 ========== */
const hemi = new THREE.HemisphereLight(0xffe0bb, 0x6a4632, 1.25);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffd6a5, 2.0);
key.position.set(3.4, 6.4, 4.8);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 9; key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1; key.shadow.camera.far = 24;
key.shadow.bias = -0.0016;
scene.add(key);
const fill = new THREE.DirectionalLight(0xb6cdff, .5);
fill.position.set(-5, 3.5, -3);
scene.add(fill);
const lampLight = new THREE.PointLight(0xffb877, 7, 14, 2);
lampLight.position.set(2.4, 2.0, -0.4);
scene.add(lampLight);

/* ========== 像素贴图 ========== */
function tex(w, h, draw, repeat){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const floorTex = tex(16,16,(x)=>{
  x.fillStyle='#d6a26d'; x.fillRect(0,0,16,16);
  x.fillStyle='#c9905c';
  for(let i=0;i<16;i+=8) x.fillRect(0,i,16,1);
  x.fillRect(7,0,1,8); x.fillRect(3,8,1,8);
  x.fillStyle='#e3b47f'; x.fillRect(0,3,16,1); x.fillRect(0,11,16,1);
},[7,7]);
const wallTex = tex(16,32,(x)=>{
  const g = x.createLinearGradient(0,0,0,32);
  g.addColorStop(0,'#8a5f42'); g.addColorStop(.55,'#a2744f'); g.addColorStop(1,'#b98a63');
  x.fillStyle=g; x.fillRect(0,0,16,32);
  x.fillStyle='rgba(255,235,210,.09)';
  for(let i=0;i<11;i++) x.fillRect((i*7)%16,(i*11)%32,1,1);
},[6,1]);
const rugTex = tex(24,24,(x)=>{
  x.fillStyle='#ffe3cd'; x.fillRect(0,0,24,24);
  x.fillStyle='#ffd2b9';
  for(let i=0;i<24;i+=4){ x.fillRect(i,0,2,1); x.fillRect(i,23,2,1); }
  for(let i=0;i<24;i+=4){ x.fillRect(0,i,1,2); x.fillRect(23,i,1,2); }
  x.fillStyle='#ffc0a6';
  for(let i=6;i<18;i+=6) for(let j=6;j<18;j+=6) x.fillRect(i,j,2,2);
},[1,1]);
const skyTex = tex(16,16,(x)=>{
  const g = x.createLinearGradient(0,0,0,16);
  g.addColorStop(0,'#3f5a8f'); g.addColorStop(.72,'#87a6d6'); g.addColorStop(1,'#ffc9a0');
  x.fillStyle=g; x.fillRect(0,0,16,16);
  x.fillStyle='#fff8dc';
  [[3,3],[11,2],[7,5],[13,6],[5,7],[9,8]].forEach(([a,b])=>x.fillRect(a,b,1,1));
  x.fillStyle='#fff3c4'; x.fillRect(9,3,2,2);
});
const picTex = tex(16,16,(x)=>{
  x.fillStyle='#ffeccd'; x.fillRect(0,0,16,16);
  x.fillStyle='#9ec4e8'; x.fillRect(1,1,14,9);
  x.fillStyle='#7aa878'; x.fillRect(1,9,14,6);
  x.fillStyle='#f5a95e'; x.fillRect(6,7,4,4);
  x.fillStyle='#3a2418'; x.fillRect(7,8,1,1); x.fillRect(9,8,1,1);
  x.fillStyle='#fff4e6'; x.fillRect(7,10,3,2);
});
const picTex2 = tex(16,16,(x)=>{
  x.fillStyle='#ffe0ea'; x.fillRect(0,0,16,16);
  x.fillStyle='#ff7f9e';
  x.fillRect(6,4,4,3); x.fillRect(5,5,6,3); x.fillRect(6,7,4,2); x.fillRect(7,9,2,2);
  x.fillStyle='#fff'; x.fillRect(6,5,1,1);
});

/* ========== 房间 ========== */
const floor = new THREE.Mesh(new THREE.CircleGeometry(19,28), new THREE.MeshToonMaterial({map:floorTex, gradientMap:GRAD}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);

const rug = new THREE.Mesh(new THREE.CircleGeometry(2.85,24), new THREE.MeshToonMaterial({map:rugTex, gradientMap:GRAD}));
rug.rotation.x = -Math.PI/2; rug.position.y = .012; rug.receiveShadow = true;
scene.add(rug);
const rugRing = new THREE.Mesh(new THREE.RingGeometry(2.05,2.22,24), toon(C.rug2));
rugRing.rotation.x = -Math.PI/2; rugRing.position.y = .018;
scene.add(rugRing);
// 地毯流苏
for (let i=0;i<28;i++){
  const a = i/28*Math.PI*2;
  const f = cube(.05,.03,.16,C.rug2);
  f.position.set(Math.cos(a)*2.88, .03, Math.sin(a)*2.88);
  f.rotation.y = -a;
  scene.add(f);
}

const wall = new THREE.Mesh(new THREE.PlaneGeometry(30,13), new THREE.MeshToonMaterial({map:wallTex, gradientMap:GRAD}));
wall.position.set(0, 6.5, -5.1); wall.receiveShadow = true;
scene.add(wall);
// 踢脚线
const skirt = cube(30,.28,.16, C.woodD);
skirt.position.set(0,.14,-5.02); scene.add(skirt);
const skirtTop = cube(30,.05,.2, 0xf0cba3);
skirtTop.position.set(0,.3,-5.0); scene.add(skirtTop);

/* 窗 */
const winW = 2.9, winH = 2.4;
const wglass = new THREE.Mesh(new THREE.PlaneGeometry(winW,winH), new THREE.MeshBasicMaterial({map:skyTex}));
wglass.position.set(-2.75,3.4,-5.03); scene.add(wglass);
const wframe = new THREE.Mesh(new THREE.TorusGeometry(1.56,.1,4,4), toon(C.wood));
wframe.position.set(-2.75,3.4,-5.0); wframe.rotation.z = Math.PI/4; wframe.scale.set(1,.835,1);
scene.add(wframe);
const wcrossV = cube(.07,winH-.1,.06,C.wood); wcrossV.position.set(-2.75,3.4,-5.0); scene.add(wcrossV);
const wcrossH = cube(winW-.1,.07,.06,C.wood); wcrossH.position.set(-2.75,3.4,-5.0); scene.add(wcrossH);
const sill = cube(winW+.5,.15,.34,C.wood); sill.position.set(-2.75,2.14,-4.9); scene.add(sill);
// 窗帘
for (const s of [-1,1]){
  const cur = cube(.42,2.9,.12,0xffc9a8);
  cur.position.set(-2.75 + s*1.82, 3.25, -4.88);
  cur.rotation.z = s*.03; scene.add(cur);
  const cur2 = cube(.2,2.9,.14,0xffb490);
  cur2.position.set(-2.75 + s*1.62, 3.25, -4.86); scene.add(cur2);
}
const rod = cube(winW+3.5,.09,.09,C.woodD); rod.position.set(-2.75,4.72,-4.86); scene.add(rod);
for (const s of [-1,1]){
  const kn = ball(.1,C.wood,1,1,1,8); kn.position.set(-2.75+s*(winW/2+1.75),4.72,-4.86); scene.add(kn);
}
// 窗台小盆栽
for (let i=0;i<3;i++){
  const p = cyl(.09,.07,.18,C.pot,8);
  p.position.set(-3.55+i*.3, 2.3, -4.84); scene.add(p);
  const l = ball(.11, i%2?C.leafA:C.leafB, 1,1.25,.9, 7);
  l.position.set(-3.55+i*.3, 2.47, -4.84); scene.add(l);
}

/* 相框 */
function wallFrame(x,y,w,h,t){
  const f = cube(w+.16,h+.16,.07,C.wood); f.position.set(x,y,-5.0); scene.add(f);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:t}));
  p.position.set(x,y,-4.95); scene.add(p);
}
wallFrame(-.85,3.15,.85,.85,picTex);
wallFrame(.5,3.35,.62,.62,picTex2);
wallFrame(-.2,2.35,.55,.55,picTex2);

/* 串灯 */
const wirePts = [];
for (let i=0;i<=48;i++){
  const t = i/48;
  wirePts.push(-3.7+t*7.4, 2.9 - Math.sin(t*Math.PI)*.62 + .1, -4.82);
}
const wireGeo = new THREE.BufferGeometry();
wireGeo.setAttribute('position', new THREE.Float32BufferAttribute(wirePts,3));
scene.add(new THREE.Line(wireGeo, new THREE.LineBasicMaterial({color:0x5c4030})));
const bulbs = [];
for (let i=0;i<=13;i++){
  const t = i/13;
  const b = cube(.1,.11,.1,0xffffff);
  b.material = new THREE.MeshBasicMaterial({color:0xffcf92});
  b.userData = {warm: i%3 !== 0};
  b.position.set(-3.7+t*7.4, 2.9 - Math.sin(t*Math.PI)*.62 - .03, -4.82);
  scene.add(b); bulbs.push(b);
}

/* 挂钟 */
const clockG = new THREE.Group();
clockG.position.set(2.6, 3.5, -4.95);
const cbody = cyl(.44,.44,.1,C.woodD,16); cbody.rotation.x = Math.PI/2; clockG.add(cbody);
const cface = cyl(.37,.37,.06,0xfff6e6,16); cface.rotation.x = Math.PI/2; cface.position.z = .06; clockG.add(cface);
const handH = cube(.05,.24,.03, C.ink); handH.position.z = .1; clockG.add(handH);
const handM = cube(.04,.32,.03, C.ink); handM.position.z = .12; clockG.add(handM);
const dot = ball(.05,C.pinkD,1,1,.5,8); dot.position.z = .13; clockG.add(dot);
scene.add(clockG);

/* 落地灯 */
const lampG = new THREE.Group();
lampG.position.set(2.55,0,-.4);
const lpole = cyl(.055,.065,2.0,C.metal,8); lpole.position.y = 1.0; lampG.add(lpole);
const lbase = cyl(.44,.5,.12,C.metal,10); lbase.position.y = .06; lampG.add(lbase);
const lshade = new THREE.Mesh(new THREE.ConeGeometry(.56,.66,10,1,true), toon(0xffe0b0,{side:THREE.DoubleSide,emissive:0x552f10}));
lshade.position.y = 2.12; lampG.add(lshade);
const lbulb = cube(.2,.14,.2,0xffffff); lbulb.material = new THREE.MeshBasicMaterial({color:0xfff0cc});
lbulb.position.y = 1.94; lampG.add(lbulb);
scene.add(lampG);

/* 大盆栽 */
const plantG = new THREE.Group();
plantG.position.set(-2.35,0,-1.55);
const potM = cyl(.34,.24,.46,C.pot,10); potM.position.y = .23; plantG.add(potM);
const potRim = new THREE.Mesh(new THREE.TorusGeometry(.33,.045,4,10), toon(0xb96248));
potRim.position.y = .46; potRim.rotation.x = Math.PI/2; plantG.add(potRim);
for (let i=0;i<9;i++){
  const a = i/9*Math.PI*2;
  const lf = ball(.2, i%2?C.leafA:C.leafB, .5,1,.85, 7);
  lf.position.set(Math.cos(a)*.22, .62 + (i%3)*.13, Math.sin(a)*.22);
  lf.rotation.z = Math.cos(a)*.8; lf.rotation.x = Math.sin(a)*.8;
  plantG.add(lf);
}
scene.add(plantG);

/* 书架 */
const shelfG = new THREE.Group();
shelfG.position.set(1.95,0,-3.1);
for (const y of [.06,.82,1.58]){
  const b = cube(1.5,.1,.46,C.wood); b.position.y = y; shelfG.add(b);
}
for (const x of [-.72,.72]){
  const s = cube(.1,1.72,.46,C.woodD); s.position.set(x,.86,0); shelfG.add(s);
}
const back = cube(1.44,1.7,.06,C.woodD); back.position.set(0,.86,-.2); shelfG.add(back);
const bookCols = [C.red,C.yellow,C.blue,C.pinkie,0x8fbf9f,0xb39ddb];
let bi = 0;
for (let row=0; row<2; row++){
  for (let i=0;i<6;i++){
    const bh = .32 + (i%3)*.07;
    const bk = cube(.13,bh,.32, bookCols[bi++ % bookCols.length]);
    bk.position.set(-.56 + i*.19, .11 + row*.76 + bh/2, .1);
    bk.rotation.z = (i%2?1:-1)*.02;
    shelfG.add(bk);
  }
}
// 顶层小玩偶 + 小盆栽
const bear = ball(.15,0xcaa07a,1,1.1,1,10); bear.position.set(-.4,1.78,.08); shelfG.add(bear);
const bearE1 = cube(.035,.035,.02,C.ink); bearE1.position.set(-.45,1.82,.2); shelfG.add(bearE1);
const bearE2 = cube(.035,.035,.02,C.ink); bearE2.position.set(-.35,1.82,.2); shelfG.add(bearE2);
const bearEars = [[-.53,1.9],[-.27,1.9]];
bearEars.forEach(([x,y])=>{ const e = ball(.05,0xcaa07a,1,1,.5,7); e.position.set(x,y,.08); shelfG.add(e); });
const suc = cyl(.11,.09,.2,C.pot,8); suc.position.set(.3,1.72,.08); shelfG.add(suc);
const sucL = ball(.1,C.leafB,1,1.6,.9,7); sucL.position.set(.3,1.94,.08); shelfG.add(sucL);
scene.add(shelfG);

/* 小茶几 */
const tableG = new THREE.Group();
tableG.position.set(-1.15,0,1.15);
const ttop = cyl(.5,.5,.09,C.wood,14); ttop.position.y = .46; tableG.add(ttop);
const tleg = cyl(.08,.09,.46,C.woodD,8); tleg.position.y = .23; tableG.add(tleg);
const cup = cyl(.1,.08,.14,0xffffff,10); cup.position.set(-.12,.57,.02); tableG.add(cup);
const cupIn = cyl(.082,.082,.02,0x8a5a3a,10); cupIn.position.set(-.12,.64,.02); tableG.add(cupIn);
const handle = new THREE.Mesh(new THREE.TorusGeometry(.055,.018,4,8), toon(0xffffff));
handle.position.set(-.02,.57,.02); handle.rotation.y = Math.PI/2; tableG.add(handle);
const saucer = cyl(.14,.14,.02,0xffffff,10); saucer.position.set(-.12,.51,.02); tableG.add(saucer);
// 小饼干盘
const plate = cyl(.16,.16,.025,0xfff2e0,12); plate.position.set(.16,.5,-.12); tableG.add(plate);
for (let i=0;i<3;i++){
  const coo = cyl(.06,.06,.03,0xc98a56,8);
  coo.position.set(.16 + (i-1)*.06, .53, -.12 + (i%2)*.05); tableG.add(coo);
}
scene.add(tableG);

/* 狗碗 */
const bowlG = new THREE.Group();
bowlG.position.set(1.35,0,1.5);
const bowl = cyl(.26,.2,.15,0xd94f4f,12); bowl.position.y = .08; bowlG.add(bowl);
const bowlIn = cyl(.22,.22,.02,0x7a4a2a,12); bowlIn.position.y = .14; bowlG.add(bowlIn);
for (let i=0;i<7;i++){
  const k = ball(.035,0x8a5a30,1,.8,1,6);

const TS = 3;
function pxLabel(text, opt){
  opt = opt || {};
  const padX = opt.padX || 3, padY = opt.padY || 2, fs = opt.fs || 10;
  const font = 'bold ' + fs + 'px "PingFang SC","Hiragino Sans GB",system-ui,sans-serif';
  const m = document.createElement('canvas').getContext('2d');
  m.font = font;
  const tw = Math.ceil(m.measureText(text).width);
  const w = tw + padX*2, h = fs + padY*2 + 2;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.font = font; x.textBaseline = 'middle';
  if (opt.bg){
    x.fillStyle = opt.border || '#3a2418';
    x.fillRect(0,0,w,h);
    x.fillStyle = opt.bg;
    x.fillRect(1,1,w-2,h-2);
  }
  if (opt.shadow){
    x.fillStyle = opt.border || '#3a2418';
    x.fillText(text, padX+1, h/2+1);
  }
  x.fillStyle = opt.fg || '#fff';
  x.fillText(text, padX, h/2);
  c.style.width = (w*TS)+'px'; c.style.height = (h*TS)+'px';
  return c;
}

/* ========== 声音（轻柔） ========== */
let actx = null;
function blip(freq, dur, type){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.value = .0001;
    o.connect(g); g.connect(actx.destination);
    const t0 = actx.currentTime;
    g.gain.exponentialRampToValueAtTime(.045, t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001, t0+(dur||.14));
    o.start(t0); o.stop(t0+(dur||.14)+.02);
  }catch(_){}
}

/* ========== 相机 & 拖动 ========== */
const YAW_K = 0.0145, PIT_K = 0.0100;
let yawT = .16, pitchT = 1.20, distT = 6.8;
let yaw = yawT, pitch = pitchT, dist = 9.5;
let spin = true, dragging = false, lastX = 0, lastY = 0, lastAct = 0, moved = 0;
const target = new THREE.Vector3(0,.92,.05);
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

function pick(cx, cy){
  ndc.x = (cx/innerWidth)*2 - 1;
  ndc.y = -(cy/innerHeight)*2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hitDog = raycaster.intersectObject(corgi.userData.hit, false).length > 0;
  const hitMan = raycaster.intersectObject(hitH, false).length > 0;
  if (hitDog) return 'dog';
  if (hitMan) return 'human';
  return null;
}

gl.addEventListener('pointerdown', e=>{
  dragging = true; lastX = e.clientX; lastY = e.clientY; moved = 0;
  lastAct = performance.now();
  try { gl.setPointerCapture(e.pointerId); } catch(_){}
});
gl.addEventListener('pointermove', e=>{
  if (!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  yawT -= dx*YAW_K;
  pitchT = Math.min(1.56, Math.max(.70, pitchT - dy*PIT_K));
  lastAct = performance.now();
});
function endDrag(e){
  if (!dragging) return;
  dragging = false;
  try { gl.releasePointerCapture(e.pointerId); } catch(_){}
  lastAct = performance.now();
  if (moved < 10){
    const who = pick(e.clientX, e.clientY);
    if (who === 'dog') reactDog(true);
    else if (who === 'human') reactHuman(true);
  }
}
gl.addEventListener('pointerup', endDrag);
gl.addEventListener('pointercancel', endDrag);

let pinch = 0;
gl.addEventListener('touchstart', e=>{
  if (e.touches.length === 2){
    pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
}, {passive:true});
gl.addEventListener('touchmove', e=>{
  if (e.touches.length === 2 && pinch){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    distT = Math.min(10, Math.max(3.4, distT*(pinch/d)));
    pinch = d; lastAct = performance.now();
    e.preventDefault();
  }
}, {passive:false});
gl.addEventListener('touchend', ()=>{ pinch = 0; }, {passive:true});
gl.addEventListener('wheel', e=>{
  e.preventDefault();
  distT = Math.min(10, Math.max(3.4, distT + e.deltaY*.0035));
  lastAct = performance.now();
}, {passive:false});

let react = {who:null, kind:null, t0:0, dur:0};

function reactDog(clicked){
  let i = Math.floor(Math.random()*DOG_LINES.length);
  if (i === dogIdx) i = (i+1) % DOG_LINES.length;
  dogIdx = i;
  const r = DOG_LINES[i];
  react = {who:'dog', kind:r.a, t0:performance.now(), dur:1300};
  showBubble(r.t, 'dog', 2000);
  blip(r.f, .13, 'triangle');
  const p = new THREE.Vector3();
  corgi.userData.head.getWorldPosition(p);
  p.y += .55;
  spawnHearts(p, clicked ? 6 : 4);
}
function reactHuman(clicked){
  let i = Math.floor(Math.random()*HUMAN_LINES.length);
  if (i === humIdx) i = (i+1) % HUMAN_LINES.length;
  humIdx = i;
  const r = HUMAN_LINES[i];
  react = {who:'human', kind:r.a, t0:performance.now(), dur:1400};
  showBubble(r.t, 'human', 2100);
  blip(r.f, .15, 'sine');
  if (r.a === 'open' || r.a === 'pat' || r.a === 'pet'){
    const p = new THREE.Vector3();
    corgi.userData.head.getWorldPosition(p); p.y += .5;
    spawnHearts(p, 5);
  } else if (r.a === 'shy'){
    const p = new THREE.Vector3();
    human.userData.headG.getWorldPosition(p); p.y += .45;
    spawnHearts(p, 4);
  }
}

/* ========== 抱抱 ========== */
let hugging = false;
let petUntil = 0;
const hugPos = new THREE.Vector3(), hugRot = {y:0, x:0};
const chestLocal = new THREE.Vector3(.02,.6,.56);

function toggleHug(){
  hugging = !hugging;
  const btn = document.getElementById('bHug');
  btn.classList.toggle('on', hugging);
  if (hugging){
    react = {who:null, kind:null, t0:0, dur:0};
    const p = new THREE.Vector3();
    corgi.userData.head.getWorldPosition(p); p.y += .45;
    spawnHearts(p, 14);
    showBubble('抱住啦～', 'dog', 2400);
    blip(700, .18, 'sine');
    setTimeout(()=>{ if (hugging) blip(880, .2, 'sine'); }, 140);
    const hp = new THREE.Vector3();
    human.userData.headG.getWorldPosition(hp); hp.y += .4;
    spawnHearts(hp, 6);
  } else {
    showBubble('汪！还想再抱', 'dog', 1600);
    blip(520, .12, 'triangle');
  }
  if (!hintEl.dataset.done){ hintEl.dataset.done = '1'; hintEl.style.opacity = 0; }
}

/* ========== 按钮 ========== */
const hintEl = document.getElementById('hint');
document.getElementById('bHug').onclick = toggleHug;
document.getElementById('bPet').onclick = ()=>{ petUntil = performance.now()+1300; reactDog(false); };

const bLight = document.getElementById('bLight');
let night = false;
bLight.onclick = ()=>{
  night = !night;
  bLight.classList.toggle('on', night);
  if (night){
    key.intensity = .55; key.color.set(0xa8beff);
    hemi.intensity = .5; hemi.color.set(0xc2ceff); hemi.groundColor.set(0x3a3550);
    lampLight.intensity = 11; fill.intensity = .75;
    scene.fog.color.set(0x1e2740); scene.background.set(0x1e2740);
    wall.material.color.set(0x8f9bc4); floor.material.color.set(0x9aa6c8);
  } else {
    key.intensity = 2.0; key.color.set(0xffd6a5);
    hemi.intensity = 1.25; hemi.color.set(0xffe0bb); hemi.groundColor.set(0x6a4632);
    lampLight.intensity = 7; fill.intensity = .5;
    scene.fog.color.set(0x3d2a1d); scene.background.set(0x2a1b13);
    wall.material.color.set(0xffffff); floor.material.color.set(0xffffff);
  }
};
const bSpin = document.getElementById('bSpin');
bSpin.onclick = ()=>{ spin = !spin; bSpin.classList.toggle('on', spin); };

/* ========== 标签定位 ========== */
const v3 = new THREE.Vector3();
function placeLabel(el, obj, dy){
  if (!el) return;
  obj.getWorldPosition(v3); v3.y += dy;
  v3.project(camera);
  if (v3.z > 1 || v3.z < -1){ el.classList.remove('on'); return; }
  el.classList.add('on');
  const x = (v3.x*.5+.5)*innerWidth, y = (-v3.y*.5+.5)*innerHeight;
  el.style.transform = 'translate(-50%,-100%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
}
const anchorDog = new THREE.Object3D(); anchorDog.position.set(0,1.62,.08); corgi.add(anchorDog);
const anchorH = new THREE.Object3D(); anchorH.position.set(0,2.0,.08); human.add(anchorH);

/* ========== 主循环 ========== */
const clock = new THREE.Clock();
let blinkAt = 2.2, blinkT = 0, heartIdle = 4;

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  const now = performance.now();

  if (spin && !dragging && now-lastAct > 1400) yawT += dt*.16;
  yaw += (yawT-yaw)*.18;
  pitch += (pitchT-pitch)*.18;
  dist += (distT-dist)*.12;
  const cp = Math.cos(pitch), sp2 = Math.sin(pitch);
  camera.position.set(
    target.x + Math.sin(yaw)*sp2*dist,
    target.y + cp*dist,
    target.z + Math.cos(yaw)*sp2*dist
  );
  camera.lookAt(target);

  /* --- 反应动画进度 --- */
  const rActive = react.kind && (now - react.t0) < react.dur;
  const rp = rActive ? (now-react.t0)/react.dur : 0;

  /* --- 狗基础动作 --- */
  const br = Math.sin(t*1.7)*.014;
  const cb = corgi.userData.body;
  cb.scale.set(1+br, 1+br*1.3, 1+br);
  cb.position.y = br*1.5;
  const U = corgi.userData;
  U.tail.rotation.z = Math.sin(t*3.6)*.28;
  U.tail.rotation.x = Math.sin(t*2.4)*.12;
  U.head.rotation.y = Math.sin(t*.6)*.17 - .08;
  U.head.rotation.x = Math.sin(t*.85)*.055;
  U.head.rotation.z = Math.sin(t*.42)*.03;
  U.tongue.scale.y = 1.15 + Math.sin(t*6)*.12;
  for (let i=0;i<2;i++){
    const s = i?1:-1;
    U.ears[i].rotation.z = s*.18 + Math.sin(t*1.5+i)*.06;
  }

  /* --- 摸摸 --- */
  const petting = now < petUntil;
  if (petting){
    corgi.position.y = Math.abs(Math.sin(t*15))*.18;
    U.tail.rotation.z = Math.sin(t*24)*.62;
    U.head.rotation.z = Math.sin(t*11)*.09;
    U.eyes.forEach(e=>{ e.scale.y = .35; });
    human.userData.S.rotation.z = Math.sin(t*9)*.012;
    human.userData.armR.userData.hand.position.y = human.userData.armR.userData.hand0.y + Math.sin(t*13)*.045;
  } else {
    U.eyes.forEach(e=>{
      blinkAt -= dt;
      if (blinkAt <= 0){ blinkT = .16; blinkAt = 2.6+Math.random()*3.2; }
      let eyeY = 1;
      if (blinkT > 0){ blinkT -= dt; eyeY = Math.max(.12, Math.abs(blinkT/.16-.5)*2); }
      e.scale.y = eyeY;
    });
  }

  /* --- 狗狗反应 --- */
  if (rActive && react.who === 'dog'){
    const k = Math.sin(rp*Math.PI);
    switch (react.kind){
      case 'jump':
        corgi.position.y = Math.abs(Math.sin(rp*Math.PI*3))*k*.42;
        break;
      case 'howl':
        U.head.rotation.x = -k*.55;
        U.tongue.scale.y = 1.15 + k*.7;
        break;
      case 'spin':
        corgi.rotation.y = corgi.userData.baseRotY + rp*Math.PI*4;
        break;
      case 'wag':
        U.tail.rotation.z = Math.sin(t*30)*.75*k;
        corgi.position.y = Math.abs(Math.sin(t*22))*.08*k;
        break;
      case 'tilt':
        U.head.rotation.z = k*.6;
        U.head.rotation.y = -k*.25;
        break;
      case 'roll':
      case 'belly':
        corgi.rotation.z = k*.9;
        corgi.position.y = k*.12;
        U.paws.forEach(p=>{ p.rotation.x = k*.6; });
        break;
      case 'toy':
        corgi.position.y = Math.abs(Math.sin(rp*Math.PI*2))*.2;
        U.tail.rotation.z = Math.sin(t*26)*.6;
        break;
    }
  } else if (!rActive){
    corgi.rotation.z += (0-corgi.rotation.z)*.14;
    U.paws.forEach(p=>{ p.rotation.x += (0-p.rotation.x)*.15; });
  }
  if (!(rActive && react.kind === 'spin')){
    const d = ((corgi.userData.baseRotY - corgi.rotation.y + Math.PI*3) % (Math.PI*2)) - Math.PI;
    corgi.rotation.y += d*.14;
  }

  /* --- 抱抱 --- */
  const manU = human.userData;
  const chestWorld = human.localToWorld(chestLocal.clone());
  if (hugging){
    corgi.position.lerp(chestWorld, .12);
    const faceYaw = Math.atan2(camera.position.x - corgi.position.x, camera.position.z - corgi.position.z);
    let d = ((faceYaw - corgi.rotation.y + Math.PI*3) % (Math.PI*2)) - Math.PI;
    corgi.rotation.y += d*.1;
    corgi.rotation.z += (0.06 - corgi.rotation.z)*.1;
    U.tail.rotation.z = Math.sin(t*18)*.55;
    U.head.rotation.x = -.1 + Math.sin(t*3)*.05;
    manU.armL.quaternion.slerp(manU.qL, .13);
    manU.armR.quaternion.slerp(manU.qR, .13);
    manU.headG.rotation.x += ((.16 + Math.sin(t*2.4)*.03) - manU.headG.rotation.x)*.1;
    heartIdle -= dt*2;
    if (heartIdle <= 0){
      heartIdle = 1.1;
      const p = new THREE.Vector3();
      U.head.getWorldPosition(p); p.y += .35;
      spawnHearts(p, 2);
    }
  } else {
    corgi.position.lerp(corgi.userData.basePos, .1);
    manU.armL.quaternion.slerp(new THREE.Quaternion(), .12);
    manU.armR.quaternion.slerp(new THREE.Quaternion(), .12);
    manU.headG.rotation.x += ((Math.sin(t*.9)*.04) - manU.headG.rotation.x)*.08;
  }
  if (!hugging){
    corgi.position.y += 0;
  }
  if (!petting && !(rActive && react.who==='dog')) {
    corgi.position.y += (corgi.userData.basePos.y - corgi.position.y)*.14;
  }

  /* --- 人类反应 --- */
  if (rActive && react.who === 'human'){
    const k = Math.sin(rp*Math.PI);
    switch (react.kind){
      case 'nod': manU.headG.rotation.x = k*.22; break;
      case 'open': manU.armR.quaternion.slerp(manU.qR, .18*k); manU.headG.rotation.x = -k*.08; break;
      case 'hand': manU.armR.userData.hand.position.y = manU.armR.userData.hand0.y + k*.18; manU.headG.rotation.z = k*.1; break;
      case 'smile': manU.cheeks.forEach(c=>{ c.scale.setScalar(1+k*.5); }); manU.headG.rotation.z = k*.08; break;
      case 'lean': manU.S.rotation.x = k*.09; manU.headG.rotation.y = k*.2; break;
      case 'pet': manU.armR.userData.hand.position.y = manU.armR.userData.hand0.y - k*.12; U.head.rotation.z = k*.2; break;
      case 'pat': manU.S.position.y = Math.abs(Math.sin(rp*Math.PI*3))*k*.05; break;
      case 'shy': manU.headG.rotation.x = k*.2; manU.cheeks.forEach(c=>{ c.scale.setScalar(1+k*.7); }); break;
    }
  } else {
    manU.cheeks.forEach(c=>{ c.scale.x += (1-c.scale.x)*.1; c.scale.y += (.62-c.scale.y)*.1; });
    manU.S.rotation.x += (0-manU.S.rotation.x)*.1;
    if (!petting) manU.armR.userData.hand.position.y += (manU.armR.userData.hand0.y - manU.armR.userData.hand.position.y)*.12;
    if (!(rActive && react.who==='human')) manU.headG.rotation.y += (0-manU.headG.rotation.y)*.1;
  }

  /* --- 环境 --- */
  const hb = Math.sin(t*1.4)*.009;
  manU.S.scale.set(1, 1+hb, 1);
  bulbs.forEach((b,i)=>{
    const k = .5+.5*Math.sin(t*2.2+i*.8);
    if (b.userData.warm) b.material.color.setRGB(1, .74+k*.20, .42+k*.30);
    else b.material.color.setRGB(1, .66+k*.16, .72+k*.18);
  });
  motes.forEach(m=>{
    m.position.y += Math.sin(t*m.userData.sp+m.userData.ph)*dt*.12;
    m.position.x += Math.cos(t*m.userData.sp*.8+m.userData.ph)*dt*.06;
  });
  handH.rotation.z = -(t*.02);
  handM.rotation.z = -(t*.24);

  for (let i=hearts.length-1;i>=0;i--){
    const h = hearts[i], d = h.userData;
    d.age += dt;
    h.position.y += d.vy*dt;
    h.position.x += d.vx*dt;
    h.material.opacity = Math.max(0, 1-d.age/d.life);
    h.scale.multiplyScalar(1+dt*.4);
    if (d.age >= d.life){ scene.remove(h); h.material.dispose(); hearts.splice(i,1); }
  }
  if (!hugging){
    heartIdle -= dt;
    if (heartIdle <= 0){
      heartIdle = 5.5+Math.random()*4;
      const p = new THREE.Vector3();
      U.head.getWorldPosition(p); p.y += .5;
      spawnHearts(p, 2);
    }
  }

  placeLabel(tagDog, anchorDog, .16);
  placeLabel(tagH, anchorH, .1);
  if (bubble && bubble.classList.contains('on')){
    const obj = bubbleOwner === 'human' ? manU.headG : U.head;
    obj.getWorldPosition(v3);
    v3.y += bubbleOwner === 'human' ? .95 : .8;
    v3.project(camera);
    if (v3.z <= 1){
      const x = (v3.x*.5+.5)*innerWidth, y = (-v3.y*.5+.5)*innerHeight;
      bubble.style.transform = 'translate(-50%,-100%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    }
  }

  renderer.render(scene, camera);
}
frame();
document.getElementById('boot').classList.add('hide');
setTimeout(()=>{
  const p = new THREE.Vector3();
  corgi.userData.head.getWorldPosition(p); p.y += .5;
  spawnHearts(p, 5);
}, 800);
</script>
</body>
</html>
